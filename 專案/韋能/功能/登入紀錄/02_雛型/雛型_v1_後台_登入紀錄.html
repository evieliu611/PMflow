<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>登入紀錄 — 土地評估圖台系統 管理後台（雛型 v1）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="_shared.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40"><path d="M20 3C10 12 7 22 14 31c3 4 9 6 14 3 6-4 8-14-8-31z" fill="#1c6fb0"/><path d="M14 31c6-2 10-8 6-16-6 8-9 12-6 16z" fill="#8bc34a"/></svg>
      <div><div class="en">VENA<br>ENERGY<br>韋能能源</div></div>
      <h1>土地評估圖台系統</h1><span class="bk-tag">管理後台</span>
    </div>
    <div class="top-right"><span>返回前台</span><span class="user-chip" id="uc">👤 測試管理者 <a href="javascript:void 0">登出</a></span></div>
  </header>
  <div class="body">
    <!-- F-01 左側選單新增「登入紀錄」入口，僅系統管理者可見【對話確認】 -->
    <!-- SPEC: 左側入口 F-01【對話確認】 位置:帳號管理下方 顯示條件:角色=系統管理者 -->
    <nav class="bk-rail" id="rail"></nav>
    <main class="bk-main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="notes-fab" onclick="toggleNotes()">討論模式</button>
<div class="notes-panel" id="notes"></div>
<section id="spec"></section>

<script>
/* ---------- 假資料（寫入時即存帳號與姓名快照，帳號之後被刪也照顯示 F-02） ---------- */
var ACC=[
 ['admin@test','測試管理者'],['AlvinLin@richitech.com.tw','Alvin'],['caseychen@richitech.com.tw','Casey'],
 ['charliehsieh@richitech.com.tw','瑞竣管理'],['evieliu@richitech.com.tw','Evie'],['karenhuang@richitech.com.tw','Karen'],
 ['sandytsai@richitech.com.tw','Sandy'],['user@test','測試使用者'],['wang2025t1','王小明'],['wang2025t2','王小明'],
 ['olduser@richitech.com.tw','林舊人']          // 已被刪除的帳號，紀錄仍保留，畫面不標示
];
var IPS=['203.69.112.45','203.69.112.46','60.248.31.207','192.168.10.23','192.168.10.58','114.35.88.140','211.23.150.9','1.34.77.201'];
var REASONS=['帳號已停用','帳號不存在'];   // 【技術確認 2026-10-29】失敗只有兩種情境
var ALL=[];
(function(){
  var t=Date.now()-25*60*1000,i,seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  for(i=0;i<120;i++){
    var a=ACC[Math.floor(rnd()*ACC.length)],ip=IPS[Math.floor(rnd()*IPS.length)],ok=rnd()>0.17,why='';
    var acct=a[0],nm=a[1];
    if(!ok){why=REASONS[Math.floor(rnd()*2)];
      if(why==='帳號不存在'){acct='alvinlin@richitech.com';nm='—';}
      if(why==='帳號已停用'){acct='wang2025t2';nm='王小明';}}
    ALL.push({acct:acct,name:nm,time:t,ip:ip,ok:ok,why:why});
    t-=Math.floor(rnd()*4*3600*1000)+60*1000;
  }
})();
function p2(n){return n<10?'0'+n:''+n;}
function fmt(ms){var d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}

/* ---------- 狀態 ---------- */
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
/* F-03 登入時間預設近 1 週：迄日=今天、起日=今天往前 6 天（含今天共 7 天）【技術討論 2026-10-29】 */
function defF(){var n=new Date(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-6);return {acct:'',name:'',from:dstr(b),to:dstr(n),ip:'',res:''};}
var S={data:'normal',f:defF(),sk:'time',sd:-1,page:1,per:10};
var qp=new URLSearchParams(location.search);
if(qp.get('state')==='empty')S.data='empty';

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2600);}

function renderRail(){
  var ic1='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>';
  var ic2='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 0h24v24H0z" fill="none"/><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>';   /* Material Icons Outlined「login」24px，顏色隨按鈕狀態（目前頁為深藍、其餘為白）【PM 2026-10-30】 */
  var h='<button data-tip="帳號管理" aria-label="帳號管理" onclick="toast(\'帳號管理為既有功能，此處僅示意\')">'+ic1+'</button>';
  h+='<button class="active" data-tip="登入紀錄" aria-label="登入紀錄">'+ic2+'</button>';
  document.getElementById('rail').innerHTML=h;
}

/* ---------- 篩選／排序 ---------- */
function filtered(){
  if(S.data==='empty')return [];
  var f=S.f,from=f.from?new Date(f.from+'T00:00:00').getTime():-Infinity,to=f.to?new Date(f.to+'T23:59:59').getTime():Infinity;
  var rows=ALL.filter(function(r){
    return (!f.acct||r.acct.toLowerCase().indexOf(f.acct.toLowerCase())>=0)
      &&(!f.name||r.name.toLowerCase().indexOf(f.name.toLowerCase())>=0)
      &&(!f.ip||r.ip.indexOf(f.ip)>=0)
      &&r.time>=from&&r.time<=to
      &&(!f.res||(f.res==='ok')===r.ok);
  });
  rows.sort(function(a,b){var x=a[S.sk]!==undefined?a[S.sk]:'',y=b[S.sk];if(S.sk==='res'){x=a.ok?1:0;y=b.ok?1:0;}
    return (x<y?-1:x>y?1:0)*S.sd;});
  return rows;
}
function sortBy(k){if(S.sk===k)S.sd=-S.sd;else{S.sk=k;S.sd=k==='time'?-1:1;}S.page=1;renderList();}

function renderMain(){
  var m=document.getElementById('main');
  var f=S.f;
  m.innerHTML=
  '<h2 class="pg">登入紀錄</h2>'+
  '<h3 class="sec-t">登入紀錄查詢</h3>'+
  '<div class="qrow">'+
   '<!-- 查詢條件依視窗寬度自動換行，換行處固定在「登入時間」之前（帳號、姓名為一組；登入時間、登入 IP、結果與按鈕為一組）【PM 2026-10-30】 -->'+
   '<div class="qg">'+
    '<!-- F-03 帳號篩選【對話確認】 --><span class="qf"><span class="q-l">帳號</span><input class="w-t" id="fa" value="'+f.acct+'" placeholder="輸入關鍵字"></span>'+
    '<span class="qf"><span class="q-l">姓名</span><input class="w-t" id="fn" value="'+f.name+'" placeholder="輸入關鍵字"></span>'+
   '</div>'+
   '<div class="qg qg-b">'+
    '<span class="qf"><span class="q-l">登入時間</span><input type="date" class="w-d" id="ff" value="'+f.from+'" max="'+f.to+'" onchange="dateChg()"><span class="dash">～</span><input type="date" class="w-d" id="ft" value="'+f.to+'" min="'+f.from+'" onchange="dateChg()"></span>'+
    '<span class="qf"><span class="q-l">登入 IP</span><input class="w-t" id="fi" value="'+f.ip+'" placeholder="輸入關鍵字"></span>'+
    '<span class="qf"><span class="q-l">結果</span><select id="fr"><option value="">不拘</option><option value="ok"'+(f.res==='ok'?' selected':'')+'>成功</option><option value="fail"'+(f.res==='fail'?' selected':'')+'>失敗</option></select></span>'+
    '<span class="qbtns"><button class="btn" onclick="clearQ()">清除</button><button class="btn primary" onclick="doQ()">查詢</button></span>'+
   '</div>'+
   '<div class="qerr" id="qerr">登入時間的起日不可晚於迄日</div>'+
  '</div><hr class="bk-hr">'+
  '<div class="bk-list-head"><h3 class="sec-t" style="margin:0">登入紀錄清單</h3><span class="cnt" id="cnt"></span></div>'+
  '<div id="tbl"></div><div class="pager" id="pager"></div>';
  renderList();
}
/* 登入時間：日曆互相鎖定（迄日不可選早於起日、起日不可選晚於迄日，起日可等於迄日＝單日查詢）；
   欄位被刪成空白或格式不合法時自動變成當天，沒有清除按鈕、不會全查【技術確認 2026-11-17】 */
function dateChg(){
  var a=document.getElementById('ff'),b=document.getElementById('ft'),t=dstr(new Date());
  if(!a.value)a.value=t;
  if(!b.value)b.value=t;
  a.max=b.value;b.min=a.value;
  document.getElementById('qerr').classList.remove('on');
}
function doQ(){
  dateChg();
  var from=document.getElementById('ff').value,to=document.getElementById('ft').value;
  if(from&&to&&from>to){document.getElementById('qerr').classList.add('on');return;}
  document.getElementById('qerr').classList.remove('on');
  S.f={acct:v('fa'),name:v('fn'),from:from,to:to,ip:v('fi'),res:v('fr')};S.page=1;renderList();
}
function v(id){return document.getElementById(id).value.trim();}
function clearQ(){S.f=defF();S.page=1;renderMain();}
function goPage(p){S.page=p;renderList();}

function renderList(){
  var rows=filtered(),total=rows.length,pages=Math.max(1,Math.ceil(total/S.per));
  if(S.page>pages)S.page=pages;
  var start=(S.page-1)*S.per,cur=rows.slice(start,start+S.per);
  function th(k,label,flag){var on=S.sk===k;return '<th class="sortable'+(on?' sorted':'')+'" onclick="sortBy(\''+k+'\')">'+label+'<span class="ar">'+(on?(S.sd>0?'▲':'▼'):'⇅')+'</span></th>';}
  var h='<table class="bk"><thead><tr><th style="width:80px">項次</th>'+
    '<!-- F-02 帳號【明確】合約3.1 -->'+th('acct','帳號')+th('name','姓名')+th('time','登入時間')+th('ip','登入 IP')+
    '<!-- F-04 結果／失敗原因【對話確認】PM 2026-10-30 確認直接做，不追加報價 -->'+th('res','結果')+th('why','失敗原因')+'</tr></thead><tbody>';
  if(!total){
    h+='<tr style="background:none"><td colspan="7"><div class="empty"><b>無符合查詢結果</b>請調整查詢條件後再試。'+'</div></td></tr>';
  }else cur.forEach(function(r,i){
    h+='<tr><td>'+(start+i+1)+'</td><td>'+r.acct+'</td><td>'+r.name+'</td><td>'+fmt(r.time)+'</td><td>'+r.ip+'</td>'+
       '<td class="'+(r.ok?'res-ok':'res-fail')+'">'+(r.ok?'成功':'失敗')+'</td><td>'+(r.why||'—')+'</td></tr>';
  });
  document.getElementById('tbl').innerHTML=h+'</tbody></table>';
  document.getElementById('cnt').textContent='共 '+total+' 筆';
  var pg='';
  if(total){pg+='<button '+(S.page===1?'disabled':'')+' onclick="goPage('+(S.page-1)+')">‹</button>';
    for(var p=1;p<=pages;p++)pg+='<button class="'+(p===S.page?'on':'')+'" onclick="goPage('+p+')">'+p+'</button>';
    pg+='<button '+(S.page===pages?'disabled':'')+' onclick="goPage('+(S.page+1)+')">›</button>';}
  document.getElementById('pager').innerHTML=pg;
}

/* ---------- 討論模式：只放未決事項 ---------- */
var QS=[
 ['Q-04','查詢效能指標（資料量大時的回應時間要求）','技術主管']
];
function renderNotes(){
  document.getElementById('notes').innerHTML='<h4>① 今天要決定的（'+QS.length+' 項）</h4>'+
   QS.map(function(q){return '<div class="q"><b>'+q[0]+'</b> '+q[1]+'<div class="own">決策者：'+q[2]+'</div></div>';}).join('')+
   '<div class="sw"><b>情境切換</b>'+
   '<label>資料：<select onchange="S.data=this.value;S.page=1;renderMain()"><option value="normal">有資料</option><option value="empty">尚無任何紀錄</option></select></label></div>'+
   '<details style="padding:8px 14px;font-size:13px;color:#555"><summary>② 已定案摘要</summary>後台既有機制只有系統管理者能進；成功與失敗皆記（直接做、不追加報價；失敗原因：帳號已停用、帳號不存在，可排序）；登入時間用起訖日期、預設近 1 週、不限制可查區間；帳號、姓名、IP 用包含關鍵字；最新在前、分頁；帳號被刪後紀錄保留；不處理保存期限。</details>';
}
function toggleNotes(){document.body.classList.toggle('notes');}

/* ---------- 規格檢視 ?spec=1 ---------- */
document.getElementById('spec').innerHTML='<h2>📋 本畫面規格（後台・登入紀錄・雛型 v1）</h2>'+
'<h3>欄位表（清單）</h3><table><tr><th>F-</th><th>欄位</th><th>型別</th><th>資料來源</th><th>顯示／互動</th></tr>'+
'<tr><td>F-02</td><td>項次</td><td>整數</td><td>依目前排序與頁碼連續編號</td><td>—</td></tr>'+
'<tr><td>F-02</td><td>帳號</td><td>文字</td><td>登入當下的帳號（寫入時存快照）</td><td>可排序；內容靠左對齊；不標示帳號目前是否仍存在</td></tr>'+
'<tr><td>F-02</td><td>姓名</td><td>文字</td><td>登入當下的姓名（快照）</td><td>可排序；帳號不存在的失敗紀錄顯示「—」</td></tr>'+
'<tr><td>F-02</td><td>登入時間</td><td>日期時間 yyyy-MM-dd HH:mm:ss</td><td>系統時間</td><td>可排序；預設由新到舊</td></tr>'+
'<tr><td>F-02</td><td>登入 IP</td><td>文字（IPv4）</td><td>登入請求的來源 IP</td><td>可排序</td></tr>'+
'<tr><td>F-04</td><td>結果</td><td>成功／失敗</td><td>登入驗證結果</td><td>可排序；失敗以紅字顯示</td></tr>'+
'<tr><td>F-04</td><td>失敗原因</td><td>文字</td><td>帳號已停用／帳號不存在【技術確認 2026-10-29】</td><td>可排序；成功者顯示「—」（排序時視為空值）</td></tr></table>'+
'<h3>欄位表（查詢條件）</h3><table><tr><th>F-</th><th>條件</th><th>型別</th><th>比對方式</th><th>預設</th></tr>'+
'<tr><td>F-03</td><td>帳號</td><td>文字</td><td>包含關鍵字，不分大小寫</td><td>空</td></tr>'+
'<tr><td>F-03</td><td>姓名</td><td>文字</td><td>包含關鍵字，不分大小寫</td><td>空</td></tr>'+
'<tr><td>F-03</td><td>登入時間</td><td>日期區間（起～迄）</td><td>起日 00:00:00 至迄日 23:59:59，含頭尾；迄日日曆中早於起日的日期不可點選、起日日曆中晚於迄日的日期不可點選（起日可等於迄日＝單日查詢）；可用鍵盤直接輸入；不可為空，欄位被刪成空白或格式不合法時自動變成當天；不限制可查詢的區間範圍（可查 1 年或更長）【技術確認 2026-11-17】</td><td>近 1 週（迄日＝今天、起日＝今天往前 6 天）【技術討論 2026-10-29】</td></tr>'+
'<tr><td>F-03</td><td>登入 IP</td><td>文字</td><td>包含關鍵字（輸入 192.168 可查整個網段）</td><td>空</td></tr>'+
'<tr><td>F-04</td><td>結果</td><td>下拉</td><td>不拘／成功／失敗</td><td>不拘</td></tr></table>'+
'<h3>業務規則</h3><ul>'+
'<li>F-01 登入紀錄為後台功能，沿用後台既有進入機制（目前只有系統管理者能進後台），本功能不另做權限判斷與無權限畫面【技術討論 2026-10-29】。</li>'+
'<li>F-02 每次登入嘗試寫入一筆紀錄；寫入當下保存帳號與姓名，之後帳號被刪除或改名都不影響既有紀錄。</li>'+
'<li>F-02 清單預設登入時間由新到舊；點欄位標題可切換排序；每頁 10 筆（與既有後台一致）；查詢條件同時成立（AND）。</li>'+
'<li>F-02 登入紀錄唯讀，畫面上沒有新增、修改、刪除；不特別處理保存期限【技術討論 2026-10-29】。</li>'+
'<li>F-03 進入頁面時登入時間預設為近 1 週並以此查詢；使用者可自行改成任意區間（日曆互相鎖定，也可用鍵盤輸入；欄位刪成空白會自動變成當天，沒有清除按鈕，不會全查）。按「查詢」套用條件並回到第 1 頁；按「清除」回到預設條件（近 1 週，其餘條件清空）並重新查詢【PM 確認 2026-10-30】。</li>'+
'<li>F-04 失敗登入也記錄，失敗情境只有「帳號已停用」「帳號不存在」兩種（技術已確認可行；PM 2026-10-30 確認直接做，不追加報價）。</li></ul>'+
'<h3>例外流程與訊息文案</h3><table><tr><th>情境</th><th>畫面行為／文案</th></tr>'+
'<tr><td>查詢無符合資料</td><td>表格區顯示「無符合查詢結果」＋「請調整查詢條件後再試。」</td></tr>'+
'<tr><td>系統尚無任何紀錄</td><td>表格區顯示「無符合查詢結果」＋「請調整查詢條件後再試。」</td></tr>'+
'<tr><td>起日晚於迄日</td><td>條件列下方紅字「登入時間的起日不可晚於迄日」，不送出查詢</td></tr>'+
'</table>';

/* ---------- 啟動 ---------- */
renderRail();renderMain();renderNotes();
if(qp.get('notes')==='1')document.body.classList.add('notes');
if(qp.get('spec')==='1')document.body.classList.add('spec');
</script>
</body>
</html>
