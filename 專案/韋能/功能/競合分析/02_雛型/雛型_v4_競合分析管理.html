function toTWD97(lat,lng){const a=6378137,e2=0.00669438002290,k0=0.9999,lon0=121*Math.PI/180,phi=lat*Math.PI/180,lam=lng*Math.PI/180;

 return [k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+250000,k0*(Mr+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];}

 if(pk)return `<div class="fld">${head}<div class="hint" style="margin-top:6px">請在地圖上點一下標記位置；標記完成後會自動切回「輸入坐標」。</div></div>`;
 const ph=(k)=>({lat:tw?'例：2613047.1':'例：23.1557',lng:tw?'例：201459.0':'例：120.0982'})[k];
 return `<div class="fld">${head}<div class="fld"><label>坐標系統</label><select data-k="csys">${CSYS.map(o=>`<option ${o===d.csys?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="cmsgrow"><div class="cmsg" data-m="lat"></div><div class="cmsg" data-m="lng"></div></div><div class="fgrid"><div class="fld"><label>${tw?'Y 坐標':'緯度'}</label><input data-k="lat" inputmode="decimal" placeholder="${ph('lat')}" value="${esc(d.lat||'')}"></div><div class="fld"><label>${tw?'X 坐標':'經度'}</label><input data-k="lng" inputmode="decimal" placeholder="${ph('lng')}" value="${esc(d.lng||'')}"></div></div></div>`;}
/* SPEC: F-03 坐標範圍即時判斷——輸入超過上限當下改為上限值；低於下限於離開欄位時改為下限；皆在標題旁顯示提示 */
function coordRange(d,k){const tw=isTW(d);return k==='lat'?(tw?[2400000,2900000,'Y 坐標']:[21.7,26.4,'緯度']):(tw?[100000,400000,'X 坐標']:[118.1,122.1,'經度']);}

function coordCheck(d){const a=parseFloat(d.lat),b=parseFloat(d.lng);if(isNaN(a)||isNaN(b))return '請輸入完整的坐標（'+(isTW(d)?'Y、X 坐標':'緯度、經度')+'）';
 if(isTW(d)){if(b<100000||b>400000)return 'X 坐標需介於 100000～400000';if(a<2400000||a>2900000)return 'Y 坐標需介於 2400000～2900000';}
 else{if(a<21.7||a>26.4)return '緯度需介於 21.7～26.4';if(b<118.1||b>122.1)return '經度需介於 118.1～122.1';}return '';}

 const d=Object.assign({},S.draft);delete d.posMode;d.stage=calcStage(d);
 for(const F of FIELDS){if(F.req&&F.t!=='coord'&&!String(d[F.k]||'').trim()){toast(`請填寫「${F.l}」`);return;}}
 for(const F of FIELDS){if(F.t==='num'&&d[F.k]&&isNaN(+d[F.k])){toast(`「${F.l}」需為數字`);return;}}
 {const ce=coordCheck(d);if(ce){toast(ce);return;}}
 if(!PH.some(p=>d['ph_'+p.k]==='1')){S.secClosed['開發進度']=false;rerenderEdit();toast('請至少勾選一項開發進度項目');return;}
 if(!S.draftPos){toast('請設定案場位置：輸入坐標，或在地圖上點選');return;}
 const now='2026/10/13 '+new Date().toTimeString().slice(0,5);
 if(S.editId==='new'){
  const c=Object.assign({id:nextId++,gl:S.draftPos[0],gn:S.draftPos[1],upd:ME+' '+now.slice(0,10),lock:null},d);c.pic=String(c.id).padStart(5,"0");cases.push(c);

 }else{
  const fm=(k,v)=>k.startsWith('ph_')?(v==='1'?'已達成':'未達成'):(v||'（空）');
  const diff=[];ALLK.forEach(([k,l])=>{const a=S.orig[k]||'',b=d[k]||'';if(a!==b)diff.push([l,fm(k,a),fm(k,b)]);});
  if(!diff.length){toast('沒有任何變更，已解除鎖定');backList();return;}
  const c=cases.find(x=>x.id===S.editId);Object.assign(c,d,{upd:ME+' '+now.slice(0,10),gl:S.draftPos[0],gn:S.draftPos[1]});
  traces.unshift({id:traceSeq++,t:now,u:ME,a:'編輯',cid:c.id,cn:c.name,diff});toast(`已儲存 ${diff.length} 項變更並寫入編輯軌跡`);
 }
 document.getElementById('infowin').dataset.id='';releaseEdit();S.view='list';render();
}

 const kw=(S.tf.q||'').trim().toLowerCase();
 const L=traces.filter(t=>{const c=cases.find(x=>x.id===t.cid);const ok=c?caseMatch(c,S.tf):(S.tf.stage.length===STG.length&&!S.tf.county&&!S.tf.town&&(!kw||t.cn.toLowerCase().includes(kw)));const dd=t.t.slice(0,10).split('/').join('-');return ok&&(!S.tf.from||dd>=S.tf.from)&&(!S.tf.to||dd<=S.tf.to)&&(S.tf.act==='all'||t.a===S.tf.act);});
 /* SPEC: F-05 編輯軌跡查詢 — 頁面顯示完整的篩選條件（開發階段／縣市／鄉鎮市區／關鍵字）＋動作篩選。從清單進入時預帶清單目前的篩選條件；從單一案場進入時，案場名稱帶入關鍵字查詢（其餘條件清空）；軌跡頁的「異動時間區間」（兩個日期欄位，中間以「~」連接，不標示「起」「迄」文字）與「動作」篩選放在同一區塊（卡片下半部，不在案場篩選條件內）；點軌跡中的案場名稱＝以該名稱查詢。軌跡頁的條件獨立於清單，可再調整 */
 const acts=['all','新增','編輯','刪除'].map(a=>`<button class="chip ${S.tf.act===a?'on':''}" onclick="S.tf.act='${a}';render()">${a==='all'?'全部':a}</button>`).join('');
 const foot=`<div style="width:100%"><div class="fl" style="margin-top:4px">動作</div><div class="chips">${acts}</div><div class="fl">異動時間區間</div><div class="drange"><input type="date" class="fsel" value="${S.tf.from||''}" onchange="setF('tf','from',this.value)"><span>~</span><input type="date" class="fsel" value="${S.tf.to||''}" onchange="setF('tf','to',this.value)"></div></div>`;
 return `<div class="panel-head"><h2>編輯軌跡</h2><button class="x" onclick="closeManage()">✕</button></div>

  ${filterCard(S.tf,'tf',`共 <b>${L.length}</b> 筆紀錄`,foot)}

/* ===== 地圖 ===== */
/* SPEC: F-08 個案點位樣式＝圓點（依開發階段著色，白色細外框）；暫存點（未儲存位置）仍為粉紅圖釘 */
const DOT=(c)=>`<svg class="dot" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${c}" stroke="#fff" stroke-width="2"/></svg>`;
const SC={開發中:'#fd7878',籌設中:'#fec001',"容許/變更中":'#ffff00',施工中:'#22b050',已併網:'#0570c0'}; /* 科技感冷色漸進，底色再刷白約 28%；點位色＝同色系略深（2026-11-13 第二次調整） */
const SCLS={'開發中':'s1','籌設中':'s2','容許/變更中':'s3','施工中':'s4','已併網':'s5'};
/* 底圖為離線示意（簡化台灣輪廓）；正式版改用 Mapbox GL，熱區用其 heatmap layer，點位用 circle/symbol layer（規格 F-08） */
const TW=[[121.6,25.3],[121.95,25.05],[121.85,24.6],[121.85,24.1],[121.62,23.5],[121.35,22.95],[120.9,22.35],[120.85,21.9],[120.7,22.05],[120.3,22.45],[120.2,22.8],[120.08,23.05],[120.1,23.5],[120.2,23.9],[120.45,24.2],[120.65,24.5],[120.85,24.95],[121.2,25.2]];
const CITY=[['台北',25.04,121.52],['台中',24.15,120.67],['台南',22.99,120.2],['高雄',22.63,120.3],['花蓮',23.98,121.6]];
const GOV=[[23.20,120.28,23.30,120.40],[23.58,120.10,23.68,120.20],[22.45,120.44,22.57,120.58],[23.95,120.28,24.05,120.38]];
const M={lat:23.6,lng:120.95,z:8.4,w:0,h:0};S.govOp=.7;S.venaOp=1;
const HEAT_END=11.8,HEAT_START=10.6;
function proj(lat,lng,z){const s=256*Math.pow(2,z??M.z),sn=Math.sin(lat*Math.PI/180);return [(lng+180)/360*s,(0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s];}
function unproj(x,y){const s=256*Math.pow(2,M.z);return [Math.atan(Math.sinh(Math.PI*(1-2*y/s)))*180/Math.PI,x/s*360-180];}
function toScr(lat,lng){const p=proj(lat,lng),c=proj(M.lat,M.lng);return [M.w/2+p[0]-c[0],M.h/2+p[1]-c[1]];}
function setCenterFromScr(lat,lng,mx,my){const p=proj(lat,lng);const c=unproj(p[0]-(mx-M.w/2),p[1]-(my-M.h/2));M.lat=c[0];M.lng=c[1];}
const LUT=(function(){/* 熱區色溫：冷（疏）藍 → 淡藍 → 暖黃 → 橘 → 深橘紅（密） */const st=[[0,[59,91,219]],[.22,[77,171,247]],[.45,[255,224,102]],[.7,[255,146,43]],[1,[217,72,15]]],L=[];for(let i=0;i<256;i++){const t=i/255;let a=st[0],b=st[st.length-1];for(let j=0;j<st.length-1;j++)if(t>=st[j][0]&&t<=st[j+1][0]){a=st[j];b=st[j+1];break;}const f=(t-a[0])/((b[0]-a[0])||1);L.push(a[1].map((v,k)=>Math.round(v+(b[1][k]-v)*f)));}return L;})();
const hc=document.createElement('canvas');
let raf=0;function drawMap(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawNow();});}
function heatOp(){return Math.min(1,Math.max(0,(HEAT_END-M.z)/(HEAT_END-HEAT_START)));}
function visibleCases(){if(S.empty)return[];if(!S.vena)return[];return S.manage?filtered():cases;}
function drawNow(){
 const mp=document.getElementById('map'),r=mp.getBoundingClientRect();M.w=Math.round(r.width);M.h=Math.round(r.height);
 const cv=document.getElementById('cv');if(cv.width!==M.w||cv.height!==M.h){cv.width=M.w;cv.height=M.h;hc.width=M.w;hc.height=M.h;}
 const g=cv.getContext('2d');g.fillStyle='#a9c7ec';g.fillRect(0,0,M.w,M.h);
 g.beginPath();TW.forEach((p,i)=>{const q=toScr(p[1],p[0]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});g.closePath();g.fillStyle='#f2ede8';g.fill();g.strokeStyle='#8fa6c6';g.lineWidth=1.5;g.stroke();
 g.strokeStyle='rgba(120,140,170,.18)';g.lineWidth=1;for(let la=21;la<=26;la+=.5){const a=toScr(la,119),b=toScr(la,123);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}for(let ln=119;ln<=123;ln+=.5){const a=toScr(26,ln),b=toScr(21,ln);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
 g.fillStyle='#8a8f98';g.font='15px sans-serif';g.textAlign='center';CITY.forEach(c=>{const q=toScr(c[1],c[2]);g.fillRect(q[0]-2,q[1]-2,4,4);g.fillText(c[0],q[0],q[1]-8);});
 const showG=S.gov;
 if(showG){g.fillStyle='rgba(230,91,91,'+S.govOp+')';g.strokeStyle='rgba(183,28,28,'+Math.min(1,S.govOp+.3)+')';g.lineWidth=2;GOV.forEach(b=>{const a=toScr(b[0],b[1]),c=toScr(b[2],b[3]);g.fillRect(a[0],c[1],c[0]-a[0],a[1]-c[1]);g.strokeRect(a[0],c[1],c[0]-a[0],a[1]-c[1]);});}
 const V=visibleCases(),ho=heatOp();
 if(ho>0&&V.length){
  const h2=hc.getContext('2d');h2.clearRect(0,0,M.w,M.h);const R=Math.max(16,46-(M.z-8)*9);
  V.forEach(c=>{const q=toScr(c.gl,c.gn);if(q[0]<-R||q[1]<-R||q[0]>M.w+R||q[1]>M.h+R)return;const gr=h2.createRadialGradient(q[0],q[1],0,q[0],q[1],R);gr.addColorStop(0,'rgba(0,0,0,.14)');gr.addColorStop(1,'rgba(0,0,0,0)');h2.fillStyle=gr;h2.beginPath();h2.arc(q[0],q[1],R,0,7);h2.fill();});
  const im=h2.getImageData(0,0,M.w,M.h),d=im.data;for(let i=0;i<d.length;i+=4){const a=d[i+3];if(a){const c=LUT[Math.min(255,Math.round(a*1.15))];d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=Math.min(255,a*3)*ho*.9*S.venaOp;}}

 mp.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const r=mp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,c=proj(M.lat,M.lng),cur=unproj(c[0]+mx-M.w/2,c[1]+my-M.h/2);M.z=Math.min(16,Math.max(6.5,M.z-e.deltaY*.0025));setCenterFromScr(cur[0],cur[1],mx,my);drawMap();},{passive:false});

document.getElementById('spec').innerHTML="<nav class=\"sptoc\"><b>快速跳到</b> <a href=\"#sp-版本紀錄\">版本紀錄</a><a href=\"#sp-一-功能概述\">一、功能概述</a><a href=\"#sp-二-畫面清單\">二、畫面清單</a><a href=\"#sp-三-畫面規格\">三、畫面規格</a><a href=\"#sp-3-1-圖層套疊-光電能源案場-F-01-\">3.1 圖層套疊：光電能源案場（F-01）</a><a href=\"#sp-3-2-入口與案場清單-F-02-\">3.2 入口與案場清單（F-02）</a><a href=\"#sp-3-3-篩選條件-F-02-\">3.3 篩選條件（F-02）</a><a href=\"#sp-3-4-地圖-熱區與點位-F-08-\">3.4 地圖：熱區與點位（F-08）</a><a href=\"#sp-3-5-點位資訊視窗-F-01-F-02-\">3.5 點位資訊視窗（F-01／F-02）</a><a href=\"#sp-3-6-新增案場-設定位置-F-03-\">3.6 新增案場：設定位置（F-03）</a><a href=\"#sp-3-7-編輯案場-F-03-\">3.7 編輯案場（F-03）</a><a href=\"#sp-3-8-共編鎖定與閒置提醒-F-04-\">3.8 共編鎖定與閒置提醒（F-04）</a><a href=\"#sp-3-9-編輯軌跡-F-05-\">3.9 編輯軌跡（F-05）</a><a href=\"#sp-3-10-匯出-F-06-\">3.10 匯出（F-06）</a><a href=\"#sp-3-11-管理中的圖層套疊-F-07-\">3.11 管理中的圖層套疊（F-07）</a><a href=\"#sp-四-權限與資料範圍\">四、權限與資料範圍</a><a href=\"#sp-五-非功能需求\">五、非功能需求</a><a href=\"#sp-六-驗收條件-AC-PG-自測與-PM-驗收共用\">六、驗收條件（AC）— PG 自測與 PM 驗收共用</a><a href=\"#sp-七-追溯表\">七、追溯表</a><a href=\"#sp-附錄\">附錄</a><a href=\"#sp-A-一致性檢查結果-2026-11-13-\">A. 一致性檢查結果（2026-11-13）</a><a href=\"#sp-B-待定清單\">B. 待定清單</a><a href=\"#sp-C-圖示清單-Material-Icons-Outlined-競合分析管理使用-\">C. 圖示清單（Material Icons Outlined，競合分析管理使用）</a></nav><h2 id=\"sp-競合分析-需求規格-v4\">競合分析 需求規格 v4</h2>\n<blockquote>依據雛型：02_雛型/雛型_v4_競合分析管理.html（2026-11-13）｜上游：01_需求整理/（需求摘要、確認紀錄）｜對應合約項次 2.4<br>狀態：草稿（待 PM 審閱）｜客戶：台灣韋能能源「土地評估圖台系統」</blockquote>\n<h3 id=\"sp-版本紀錄\">版本紀錄</h3>\n<div class=\"spscroll\"><table><tr><th>版本</th><th>日期</th><th>依據雛型</th><th>主要異動</th></tr><tr><td>v4</td><td>2026-11-13</td><td>v4</td><td>首次產出規格。v1～v3 為討論用雛型（v1：2026-10-13 訪談；v3：2026-11-12 客戶訪談），規格以 v4 定稿內容為準。</td></tr></table></div>\n<h3 id=\"sp-一-功能概述\">一、功能概述</h3>\n<p>韋能目前以 Excel 手工維護光電市場競合表（約 520 筆、多人編輯、坐標格式混雜、缺漏多、無編輯歷程）。本功能在土地評估圖台上提供：</p>\n<ul><li>圖層套疊新增「光電能源案場」分類，展繪競合案場；</li><li>「競合分析管理」面板，讓韋能同仁新增、編輯、刪除案場，並可共編（單一案場鎖定）；</li><li>編輯軌跡（欄位前後值）與依篩選條件匯出 Excel。</li></ul>\n<p><b>User Story</b></p>\n<ul><li>US-01：身為韋能同仁，我要在圖層套疊看到面（施工/已併網）與點（開發/許可中）的競合案場，以便評估土地競合。</li><li>US-02：身為韋能同仁，我要在清單中新增、編輯、刪除案場，以便維持競合資料最新。</li><li>US-03：身為共編者，我要在別人編輯某案場時看到它被鎖定，以便避免覆蓋彼此的修改。</li><li>US-04：身為韋能同仁，我要查看全部或單一案場的編輯軌跡，以便追溯誰改了什麼。</li></ul>\n<p><b>不在本次範圍</b>：能源署面資料（面圖層）不可共編；審核確認功能已取消；Excel 匯入功能（資料由客戶依我方提供的清單整理好，匯入方式見附錄 B）。</p>\n<h3 id=\"sp-二-畫面清單\">二、畫面清單</h3>\n<div class=\"spscroll\"><table><tr><th>#</th><th>畫面</th><th>雛型入口（<code>02_雛型/雛型_v4_競合分析管理.html</code>）</th><th>截圖</th><th>用途</th></tr><tr><td>3.1</td><td>圖層套疊：光電能源案場</td><td>預設畫面</td><td>v4_圖層套疊_光電能源案場.png</td><td>勾選面／點圖層</td></tr><tr><td>3.2</td><td>入口與案場清單</td><td><code>?state=list</code></td><td>v4_管理_案場清單.png</td><td>清單、新增、刪除</td></tr><tr><td>3.3</td><td>篩選條件</td><td><code>?state=list&amp;fopen=1</code></td><td>v4_管理_案場清單_篩選展開.png</td><td>依階段／縣市／關鍵字篩選</td></tr><tr><td>3.4</td><td>地圖：熱區與點位</td><td><code>?state=list&amp;z=8.4…</code>／<code>z=12…</code></td><td>v4_管理_案場清單_熱區.png、_點位.png</td><td>小比例尺熱區、大比例尺點位</td></tr><tr><td>3.5</td><td>點位資訊視窗</td><td><code>?state=popup</code></td><td>v4_管理_案場清單_點位資訊視窗.png</td><td>唯讀檢視案場全部資訊</td></tr><tr><td>3.6</td><td>新增案場：設定位置</td><td><code>?state=pick</code>、<code>picked</code></td><td>v4_新增案場_地圖點選中.png、_已標記位置.png</td><td>輸入坐標或地圖點選</td></tr><tr><td>3.7</td><td>編輯案場</td><td><code>?state=edit</code></td><td>v4_管理_編輯案場.png、_開發進度.png</td><td>欄位編輯、開發進度</td></tr><tr><td>3.8</td><td>共編鎖定與閒置提醒</td><td><code>?state=idle</code></td><td>v4_管理_閒置解鎖提醒.png</td><td>鎖定與逾時解除</td></tr><tr><td>3.9</td><td>編輯軌跡</td><td><code>?state=trace</code>、<code>trace1</code></td><td>v4_管理_編輯軌跡.png、_單一案場.png</td><td>追溯異動</td></tr><tr><td>3.10</td><td>匯出</td><td><code>?state=export</code></td><td>v4_管理_匯出.png</td><td>依篩選匯出 Excel</td></tr><tr><td>3.11</td><td>管理中的圖層套疊</td><td><code>?state=managelayers</code>、<code>editlayers</code></td><td>v4_管理_圖層套疊_點位與面圖層.png、v4_編輯中切換至圖層套疊_有橘點.png</td><td>管理中不鎖定圖層</td></tr><tr><td>—</td><td>空狀態</td><td><code>?state=list&amp;empty=1</code>、篩選無結果</td><td>v4_管理_案場清單_空清單.png、_無符合條件.png</td><td>非理想狀態</td></tr></table></div>\n<hr>\n<h3 id=\"sp-三-畫面規格\">三、畫面規格</h3>\n<h4 id=\"sp-3-1-圖層套疊-光電能源案場-F-01-\">3.1 圖層套疊：光電能源案場（F-01）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_圖層套疊_光電能源案場.png\" alt=\"圖層套疊\"></figure>\n<p><b>欄位表</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>分類卡片</td><td>光電能源案場</td><td>圖層分類</td><td>—</td><td>—</td><td>展開</td><td>系統設定</td><td>位於圖層套疊分類清單<b>最後一項</b>；圖示 <code>article</code>；右側為「全部開啟／全部關閉」圖示與展開箭頭（版型比照現有系統）；可展開／收合</td><td>F-01</td></tr><tr><td>圖層</td><td>施工/已併網案件（面圖層）</td><td>核取方塊＋透明度滑桿</td><td>—</td><td>—</td><td>勾選（雛型）</td><td>固定面資料（原能源署核准案場）</td><td>勾選／取消即時顯示／隱藏於地圖；勾選後顯示「透明度」滑桿（沿用既有圖層機制）；唯讀、顏色不調整，待圖資部門確認後上架</td><td>F-01</td></tr><tr><td>圖層</td><td>開發/許可中案件（點圖層）</td><td>核取方塊＋透明度滑桿</td><td>—</td><td>—</td><td>勾選（雛型）</td><td>競合分析管理的全部案場（不分開發階段）</td><td>勾選／取消即時顯示／隱藏；縮小為熱區、放大為點位（見 3.4）；點擊點位開啟資訊視窗（見 3.5）</td><td>F-01</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-01：點圖層顯示管理清單內<b>所有</b>案場，不依開發階段篩選；案場若已併網，由客戶自行在管理清單決定是否刪除。</li><li>BR-02：圖層列不標示多邊形／點的圖示、不標示資料來源；勾選的圖層下方提供「透明度」調整（沿用既有圖層機制）；入口只有左側圖示列。</li><li>BR-03：本分類圖示為 Material Icons Outlined <code>article</code>，與左側「競合分析管理」入口相同。</li><li>BR-04：各分類圖示一律為 Material Icons svg，不使用 emoji（圖示清單見附錄 C）。</li></ul>\n<p><b>例外流程</b>：無（純勾選操作）。</p>\n<h4 id=\"sp-3-2-入口與案場清單-F-02-\">3.2 入口與案場清單（F-02）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_案場清單.png\" alt=\"案場清單\"></figure>\n<p><b>欄位表</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>左側按鈕</td><td>競合分析管理</td><td>圖示按鈕</td><td>—</td><td>—</td><td>未點擊：白色圖示</td><td>—</td><td>位於圖示列最後一顆（定位工具下方）；懸停顯示「競合分析管理」；點擊進入管理，按鈕呈白底深色圖示</td><td>F-02</td></tr><tr><td>面板</td><td>標題列</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>標題「競合分析管理」、「新增案場」按鈕（圖示 <code>add</code>＋文字）、✕ 離開管理</td><td>F-02</td></tr><tr><td>卡片</td><td>篩選條件</td><td>可收合卡片</td><td>—</td><td>—</td><td><b>收合</b></td><td>—</td><td>點標題列展開／收合；收合時仍顯示「共 N 筆」「匯出」「編輯軌跡」</td><td>F-02</td></tr><tr><td>清單項目</td><td>案場名稱</td><td>文字</td><td>—</td><td>—</td><td>—</td><td>案場資料</td><td>粗體 14px；名稱過長時<b>最後 3 字以「...」取代</b>，懸停顯示完整名稱</td><td>F-02</td></tr><tr><td>清單項目</td><td>開發階段標籤</td><td>標籤</td><td>—</td><td>—</td><td>—</td><td>案場資料</td><td>標籤為填滿色（無外框），顏色取地圖圓點原色調淡約 50%：開發中 #febbbb（原色 #fd7878）、籌設中 #fedf80（#fec001）、容許/變更中 #ffff80（#ffff00）、施工中 #90d7a7（#22b050）、已併網 #82b7df（#0570c0）；文字一律深色 #0B1B3A；不顯示 [1]～[5]</td><td>F-02</td></tr><tr><td>清單項目</td><td>縣市 鄉鎮市區</td><td>文字</td><td>—</td><td>—</td><td>—</td><td>案場資料</td><td>與開發階段同一行</td><td>F-02</td></tr><tr><td>清單項目</td><td>鎖頭</td><td>圖示 <code>lock</code></td><td>—</td><td>—</td><td>隱藏</td><td>鎖定狀態</td><td>案場被他人鎖定時，顯示於行尾、刪除鈕正上方；不顯示是誰鎖定</td><td>F-04</td></tr><tr><td>清單項目</td><td>操作鈕</td><td>圖示按鈕×3</td><td>—</td><td>—</td><td>—</td><td>—</td><td>編輯軌跡（<code>history</code>）、編輯（<code>edit</code>）、刪除（<code>delete</code>）；懸停顯示名稱；被他人鎖定時編輯、刪除不可用</td><td>F-02／F-05</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-05：點擊清單項目 → 地圖飛到該案場並放大到點位層級，同時開啟資訊視窗（3.5）。</li><li>BR-06：點「刪除」跳出確認視窗，確認後案場從清單與地圖移除、<b>不可復原</b>，僅在編輯軌跡留紀錄。</li><li>BR-07：所有登入且可進入管理的使用者皆可新增、編輯、刪除案場。</li><li>BR-08a：<b>篩選條件卡片固定在面板上方，捲軸只出現在下方的案場清單</b>（捲動清單時標題列與篩選條件不動）。</li><li>BR-08：清單排序／分頁：雛型未定義，<b>【需 PG 確認】</b>（資料量約 500 筆）。</li></ul>\n<p><b>例外流程與錯誤訊息</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>刪除確認</td><td>跳出視窗，按「取消」關閉、按「確定刪除」刪除</td><td>標題「刪除案場」；內文「確定刪除「{案場名稱}」？」；說明「案場會從清單與地圖移除；刪除動作會留在編輯軌跡中。刪除後不可復原。」</td></tr><tr><td>刪除完成</td><td>清單移除、寫入軌跡</td><td>「已刪除，並寫入編輯軌跡」</td></tr><tr><td>他人鎖定案場按編輯</td><td>不進入編輯</td><td>「🔒 {鎖定者} 於 {起始時間} 起正在編輯「{案場名稱}」，請待對方儲存或取消後再編輯」</td></tr><tr><td>已在編輯另一筆時再按編輯</td><td>不切換</td><td>「您正在編輯另一筆案場，請先儲存或取消」</td></tr><tr><td>清單完全沒有案場</td><td>顯示空狀態</td><td>粗體「目前沒有案場資料」</td></tr><tr><td>篩選後無結果</td><td>顯示空狀態</td><td>粗體「無符合查詢結果」＋灰字「請調整查詢條件後再試。」</td></tr></table></div>\n<h4 id=\"sp-3-3-篩選條件-F-02-\">3.3 篩選條件（F-02）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_案場清單_篩選展開.png\" alt=\"篩選展開\"></figure>\n<p><b>欄位表</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>按鈕組</td><td>開發階段</td><td>按鈕式多選</td><td>否</td><td>—</td><td><b>5 種全部選取（on）</b></td><td>5 種階段</td><td>點按切換選取／取消；選中為深色底、未選為白底灰字（不套用階段色）；取消的階段不顯示，全部取消則無結果</td><td>F-02</td></tr><tr><td>下拉</td><td>縣市</td><td>單選</td><td>否</td><td>—</td><td>全部</td><td>22 縣市，由北到南排序：基隆市、臺北市、新北市、桃園市、新竹市、新竹縣、苗栗縣、臺中市、彰化縣、南投縣、雲林縣、嘉義市、嘉義縣、臺南市、高雄市、屏東縣、宜蘭縣、花蓮縣、臺東縣、澎湖縣、金門縣、連江縣</td><td>選擇後更新鄉鎮市區選項</td><td>F-02</td></tr><tr><td>下拉</td><td>鄉鎮市區</td><td>單選</td><td>否</td><td>—</td><td>全部</td><td>依縣市連動</td><td>縣市為「全部」時僅「全部」</td><td>F-02</td></tr><tr><td>輸入框</td><td>關鍵字查詢</td><td>文字</td><td>否</td><td>—</td><td>空</td><td>—</td><td>輸入即時篩選；比對案場名稱、案場編號、光電類型、專區/分區/編訂、土地權屬、集團、公司名稱、備註</td><td>F-02</td></tr><tr><td>文字</td><td>共 N 筆</td><td>唯讀</td><td>—</td><td>—</td><td>—</td><td>篩選結果</td><td>隨條件即時更新</td><td>F-02</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-09：篩選結果同時決定：清單內容、地圖上的點位（管理中）、「匯出」內容、「編輯軌跡」預帶條件。</li><li>BR-10：各條件之間為「且」；開發階段為多選（符合任一已選取階段即顯示）。</li></ul>\n<h4 id=\"sp-3-4-地圖-熱區與點位-F-08-\">3.4 地圖：熱區與點位（F-08）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_案場清單_熱區.png\" alt=\"熱區\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_案場清單_點位.png\" alt=\"點位\"></figure>\n<p><b>業務規則</b></p>\n<ul><li>BR-12：<b>熱區（色溫）</b>：以案場密度呈現，冷色＝稀疏、暖色＝密集，色階 #3B5BDB → #4DABF7 → #FFE066 → #FF922B → #D9480F；權重為案場筆數；熱區半徑隨縮放縮小。</li><li>BR-13：<b>切換</b>：縮放 &lt; z10.6（比例尺約 1:35 萬以上）全熱區；z10.6～11.8 熱區與點位淡入淡出；≥ z11.8（約 1:15 萬以下）全點位。畫面右下角顯示目前縮放與模式。切換級數與效果由我方設計，開發可依 Mapbox 實作調整。</li><li>BR-14：<b>點位樣式為圓點</b>（直徑約 20px、白色 2px 外框），<b>顏色依開發階段</b>：開發中 #fd7878、籌設中 #fec001、容許/變更中 #ffff00、施工中 #22b050、已併網 #0570c0；被他人鎖定的案場圓點降低透明度。未儲存的位置（新增／編輯時的暫存點）仍為粉紅圖釘。</li><li>BR-15：點位上顯示案場名稱標籤；被他人鎖定的點位以淡化＋鎖頭標示。</li></ul>\n<h4 id=\"sp-3-5-點位資訊視窗-F-01-F-02-\">3.5 點位資訊視窗（F-01／F-02）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_案場清單_點位資訊視窗.png\" alt=\"資訊視窗\"></figure>\n<p><b>欄位表（唯讀）</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>標題</td><td>開發/許可中案件</td><td>文字</td><td>—</td><td>—</td><td>—</td><td>圖層名稱</td><td>—</td><td>F-01</td></tr><tr><td>列</td><td>案場名稱、案場編號、縣市、鄉鎮市區、坐標、光電類型、專區/分區/編訂、土地權屬</td><td>文字</td><td>—</td><td>—</td><td>無值顯示「-」</td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>列</td><td>集團、公司名稱、開始日期（yyyy/mm）</td><td>文字</td><td>—</td><td>—</td><td>無值顯示「-」</td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>列</td><td>裝置容量（MW）、目標裝置容量（MW）、面積（公頃）</td><td>數值</td><td>—</td><td>—</td><td>無值顯示「-」</td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>列</td><td>開發階段</td><td>文字（5 行）</td><td>—</td><td>—</td><td>依序列出開發中、籌設中、容許/變更中、施工中、已併網：<b>已達成的前方顯示「v」，未達成顯示「-」（皆為黑色文字，非 emoji）；後方有年月資訊就標上（yyyy/mm）</b>；版面以三欄對齊（符號｜階段名稱｜年月），年月上下對齊</td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>列</td><td>備註</td><td>文字</td><td>—</td><td>—</td><td>無值顯示「-」</td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>列</td><td>最後異動日期</td><td>日期</td><td>—</td><td>—</td><td>只顯示日期（如 2025/01/08），<b>不標人員</b></td><td>案場資料</td><td>唯讀</td><td>F-02</td></tr><tr><td>按鈕</td><td>✕</td><td>關閉</td><td>—</td><td>—</td><td>—</td><td>—</td><td>關閉視窗</td><td>F-02</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-16：版型<b>以現有系統圖層資訊視窗「公版」為準</b>（標題＋逐列「欄位名稱／值」），技術開發照公版實作；雛型僅示意。</li><li>BR-17：視窗呈現競合分析管理內的<b>全部資訊</b>（案場名稱、開發階段五項、最後異動日期等），坐標不另標坐標系統；<b>不納入編輯軌跡</b>，也沒有編輯／刪除／軌跡按鈕。</li><li>BR-18：內容過長時視窗內可捲動；視窗放不下時開在點位下方。</li></ul>\n<h4 id=\"sp-3-6-新增案場-設定位置-F-03-\">3.6 新增案場：設定位置（F-03）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_新增案場_地圖點選中.png\" alt=\"地圖點選中\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_新增案場_已標記位置.png\" alt=\"已標記位置\"></figure>\n<p><b>欄位表</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>切換鈕</td><td>輸入坐標／地圖點選</td><td>二選一</td><td>是</td><td>—</td><td>輸入坐標</td><td>—</td><td>選「地圖點選」→ 地圖上方出現提示列「請點擊地圖標記案場位置」；點擊地圖自動帶入坐標，坐標欄位唯讀，可重新點選修正；點擊地圖以外的地方即取消地圖點選（沿用既有機制）</td><td>F-03</td></tr><tr><td>下拉</td><td>坐標系統</td><td>單選</td><td>是</td><td>—</td><td>WGS84 經緯度</td><td>WGS84 經緯度／TWD97 TM2 121 分帶</td><td>切換為 TWD97 時欄位標籤改為 X／Y；兩者互相換算</td><td>F-03</td></tr><tr><td>輸入</td><td>緯度（或 Y）</td><td>數值</td><td>是</td><td>WGS84：21.7～26.4；TWD97 Y：2400000～2900000</td><td>空</td><td>使用者輸入／地圖點選</td><td>輸入時地圖同步顯示粉紅暫存點</td><td>F-03</td></tr><tr><td>輸入</td><td>經度（或 X）</td><td>數值</td><td>是</td><td>WGS84：118.1～122.1；TWD97 X：100000～400000</td><td>空</td><td>使用者輸入／地圖點選</td><td>同上</td><td>F-03</td></tr><tr><td>地圖</td><td>暫存點</td><td>粉紅標記</td><td>—</td><td>—</td><td>—</td><td>—</td><td>標籤「案場位置（未儲存）」</td><td>F-03</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-19：沒有位置時「儲存」按鈕反灰、不可按。</li><li>BR-20：地圖點選後顯示「已帶入坐標：{緯度}, {經度}（可再點選修正）」，並自動切回「輸入坐標」模式。</li><li>BR-21：坐標限定範圍（WGS84）：緯度須介於 21.7 與 26.4、經度須介於 118.1 與 122.1；TWD97 範圍沿用現有「坐標定位」功能（見附錄 B）。</li><li>BR-21a：<b>坐標範圍於輸入當下即時判斷</b>：數值超過上限時，立即自動改為上限值；數值低於下限時，於離開欄位（或按 Enter）時自動改為下限值（輸入中途的未完成數字，如先打「2」再打「23.1」，不會被提早改掉）。自動調整後，在緯度／經度欄位的上一列以紅字提示「{欄位}需介於 {下限}～{上限}」，該欄改回範圍內數值後提示消失；調整後的值同步更新地圖暫存點。</li></ul>\n<p><b>例外流程與錯誤訊息</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>坐標未填完整</td><td>「儲存」按鈕反灰、不可按</td><td>—（防呆備援文案：「請輸入完整的坐標（緯度、經度）」；TWD97：「請輸入完整的坐標（Y、X 坐標）」）</td></tr><tr><td>緯度超出範圍</td><td>超過上限立即改為 26.4、低於下限於離開欄位時改為 21.7</td><td>緯度／經度欄位的上一列：「緯度需介於 21.7～26.4」</td></tr><tr><td>經度超出範圍</td><td>超過上限立即改為 122.1、低於下限於離開欄位時改為 118.1</td><td>「經度需介於 118.1～122.1」</td></tr><tr><td>TWD97 X 超出範圍</td><td>同上（上限 400000／下限 100000）</td><td>「X 坐標需介於 100000～400000」</td></tr><tr><td>TWD97 Y 超出範圍</td><td>同上（上限 2900000／下限 2400000）</td><td>「Y 坐標需介於 2400000～2900000」</td></tr><tr><td>沒有設定位置</td><td>「儲存」按鈕反灰、不可按</td><td>—（防呆備援文案：「請設定案場位置：輸入坐標，或在地圖上點選」）</td></tr></table></div>\n<h4 id=\"sp-3-7-編輯案場-F-03-\">3.7 編輯案場（F-03）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_編輯案場.png\" alt=\"編輯案場\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_編輯案場_開發進度.png\" alt=\"開發進度\"></figure>\n<p><b>欄位表</b>（分類可收合；案場編號、案場名稱、備註不屬任何分類、不收合）</p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>唯讀</td><td>案場編號</td><td>文字</td><td>—</td><td>系統產生：5 碼流水號（00001 起）；建立後不變、刪除後不重用</td><td>新增時顯示「儲存後由系統自動編號」</td><td>系統</td><td>不可編輯</td><td>F-03</td></tr><tr><td>輸入</td><td>案場名稱</td><td>文字</td><td>是</td><td>最多 20 字</td><td>空</td><td>使用者輸入</td><td>輸入框內左側固定顯示「最多 20 字」；輸入達 20 字時，標題後才另外出現「最多 20 字」註記；超過上限無法再輸入</td><td>F-03</td></tr><tr><td>下拉</td><td>縣市</td><td>單選</td><td>是</td><td>22 縣市：基隆市、臺北市、新北市、桃園市、新竹市、新竹縣、苗栗縣、臺中市、彰化縣、南投縣、雲林縣、嘉義市、嘉義縣、臺南市、高雄市、屏東縣、宜蘭縣、花蓮縣、臺東縣、澎湖縣、金門縣、連江縣</td><td>請選擇</td><td>選單</td><td>自選，不以坐標自動判斷</td><td>F-03</td></tr><tr><td>下拉</td><td>鄉鎮市區</td><td>單選</td><td>是</td><td>依縣市連動</td><td>請先選縣市</td><td>選單</td><td>自選，不以坐標自動判斷</td><td>F-03</td></tr><tr><td>坐標組</td><td>坐標</td><td>見 3.6</td><td>是</td><td>見 3.6</td><td>—</td><td>—</td><td>見 3.6</td><td>F-03</td></tr><tr><td>下拉</td><td>光電類型</td><td>單選</td><td>否</td><td>水面型、農電共生、漁電共生(室外)、地面型、漁電共生(室內)、屋頂型</td><td>請選擇</td><td>選單</td><td>—</td><td>F-03</td></tr><tr><td>輸入</td><td>專區/分區/編訂</td><td>文字</td><td>否</td><td>最多 10 字</td><td>空</td><td>使用者輸入</td><td>輸入框內左側固定顯示「最多 10 字」；輸入達 10 字時，標題後才另外出現「最多 10 字」註記；超過上限無法再輸入</td><td>F-03</td></tr><tr><td>下拉</td><td>土地權屬</td><td>單選</td><td>否</td><td>私人、國產署、台糖、工業局、地方政府</td><td>請選擇</td><td>選單</td><td>—</td><td>F-03</td></tr><tr><td>輸入</td><td>集團</td><td>文字</td><td>否</td><td>最多 100 字</td><td>空</td><td>使用者輸入</td><td>輸入框內左側固定顯示「最多 100 字」；輸入達 100 字時，標題後才另外出現「最多 100 字」註記；超過上限無法再輸入</td><td>F-03</td></tr><tr><td>輸入</td><td>公司名稱</td><td>文字</td><td>否</td><td>最多 100 字</td><td>空</td><td>使用者輸入</td><td>輸入框內左側固定顯示「最多 100 字」；輸入達 100 字時，標題後才另外出現「最多 100 字」註記；超過上限無法再輸入</td><td>F-03</td></tr><tr><td>年月</td><td>開始日期</td><td>年月</td><td>否</td><td>只記到年月（yyyy/mm）</td><td>空</td><td>使用者輸入</td><td>—</td><td>F-03</td></tr><tr><td>輸入</td><td>裝置容量（MW）</td><td>數值</td><td>否</td><td>數值、不小於 0；單位統一為 MW</td><td>空</td><td>使用者輸入</td><td>—</td><td>F-03</td></tr><tr><td>輸入</td><td>目標裝置容量（MW）</td><td>數值</td><td>否</td><td>數值、不小於 0；單位 MW</td><td>空</td><td>使用者輸入</td><td>—</td><td>F-03</td></tr><tr><td>輸入</td><td>面積（公頃）</td><td>數值</td><td>否</td><td>數值、不小於 0</td><td>空</td><td>使用者輸入</td><td>—</td><td>F-03</td></tr><tr><td>唯讀</td><td>開發階段</td><td>標籤</td><td>—</td><td>由開發進度項目自動判斷，不可手動修改</td><td>依已勾選項目</td><td>系統</td><td>取已勾選項目中最後一項；未勾選顯示「—」</td><td>F-03</td></tr><tr><td>勾選＋年月</td><td>開發進度項目（5 項）</td><td>核取方塊＋年月</td><td><b>至少勾選 1 項</b></td><td>開發中、籌設中、容許/變更中、施工中、已併網；各項年月只記到年月、選填</td><td>全不勾</td><td>使用者輸入</td><td>勾選後該項年月可填；取消勾選年月停用</td><td>F-03</td></tr><tr><td>輸入</td><td>備註</td><td>多行文字</td><td>否</td><td>最多 500 字</td><td>空</td><td>使用者輸入</td><td>輸入框內左側固定顯示「最多 500 字」；輸入達 500 字時，標題後才另外出現「最多 500 字」註記；超過上限無法再輸入</td><td>F-03</td></tr><tr><td>按鈕</td><td>取消／儲存</td><td>—</td><td>—</td><td><b>必填欄位未全部填妥時，「儲存」按鈕反灰、不可按</b></td><td>新增時反灰</td><td>—</td><td>必填：案場名稱、縣市、鄉鎮市區、坐標、至少勾選一項開發進度；全部填妥後「儲存」可按</td><td>F-03</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-22：所有文字輸入框的標題後與輸入框內（placeholder）都預設顯示「最多 X 字」提示，超過上限無法再輸入。</li><li>BR-22a：必填欄位（案場名稱、縣市、鄉鎮市區、坐標、至少一項開發進度）未全部填妥時，「儲存」按鈕反灰不可按；填妥後才可按。</li><li>BR-23：開發階段取「已勾選開發進度項目中最後一項」（依順序：開發中 &lt; 籌設中 &lt; 容許/變更中 &lt; 施工中 &lt; 已併網）。</li><li>BR-24：儲存時若與原資料無差異：不寫入軌跡、解除鎖定。</li><li>BR-25：新增儲存成功 → 寫入軌跡「新增」；編輯儲存成功 → 寫入軌跡「編輯」（欄位前後值）。</li><li>BR-26：未儲存離開（取消／離開管理）→ 放棄變更並解除鎖定。</li></ul>\n<p><b>例外流程與錯誤訊息</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>必填欄位留空</td><td>「儲存」按鈕反灰、不可按；補齊後才可按</td><td>—（防呆備援文案：「請填寫「案場名稱」」「請填寫「縣市」」「請填寫「鄉鎮市區」」）</td></tr><tr><td>數值欄位填入非數字</td><td>不儲存</td><td>「「裝置容量（MW）」需為數字」（目標裝置容量、面積同）</td></tr><tr><td>坐標／位置問題</td><td>不儲存</td><td>見 3.6</td></tr><tr><td>一項開發進度都沒勾</td><td>「儲存」按鈕反灰、不可按</td><td>—（防呆備援文案：「請至少勾選一項開發進度項目」）</td></tr><tr><td>無變更儲存</td><td>解除鎖定、不寫軌跡</td><td>「沒有任何變更，已解除鎖定」</td></tr><tr><td>新增成功</td><td>回清單、寫入軌跡</td><td>「已新增案場並寫入編輯軌跡」</td></tr><tr><td>編輯成功</td><td>回清單、寫入軌跡</td><td>「已儲存 {N} 項變更並寫入編輯軌跡」</td></tr><tr><td>編輯中離開管理</td><td>跳出確認</td><td>標題「尚有編輯中的案場」；「離開管理將放棄未儲存的變更，並解除「{案場名稱}」的鎖定。」；按鈕「繼續編輯」「放棄並離開」</td></tr></table></div>\n<h4 id=\"sp-3-8-共編鎖定與閒置提醒-F-04-\">3.8 共編鎖定與閒置提醒（F-04）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_閒置解鎖提醒.png\" alt=\"閒置提醒\"></figure>\n<p><b>業務規則</b></p>\n<ul><li>BR-27：鎖定單位為「單一案場」：A 編輯某案場時，該案場對他人唯讀（編輯、刪除不可用，清單顯示鎖頭，不顯示是誰鎖定）；其他案場不受影響。</li><li>BR-28：釋放條件：儲存、取消、離開管理（放棄）、閒置逾時自動解除。<b>不提供管理者強制解鎖。</b></li><li>BR-29：閒置 30 分鐘自動解除；解除前 5 分鐘跳出提醒；<b>不自動存檔</b>。</li><li>BR-30：編輯畫面頂端顯示提示「編輯中：其他人暫時無法編輯此案場；閒置 30 分鐘將自動解除鎖定。」</li><li>BR-31：鎖定狀態如何即時同步（他人鎖定多快反映在清單）：<b>【待技術確認】</b>（Q-09）。</li></ul>\n<p><b>例外流程與錯誤訊息</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>閒置剩 5 分鐘</td><td>跳出視窗</td><td>標題「即將解除編輯鎖定」；「您已閒置將近 30 分鐘，約 5 分鐘後將自動解除此案場的鎖定，讓其他人可以編輯。」；「系統不會自動儲存您目前的修改，請先儲存，或繼續編輯。」；按鈕「放棄並離開」「繼續編輯」</td></tr></table></div>\n<h4 id=\"sp-3-9-編輯軌跡-F-05-\">3.9 編輯軌跡（F-05）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_編輯軌跡.png\" alt=\"編輯軌跡\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_編輯軌跡_刪除紀錄.png\" alt=\"刪除紀錄\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_編輯軌跡_單一案場.png\" alt=\"單一案場軌跡\"></figure>\n<p><b>欄位表</b></p>\n<div class=\"spscroll\"><table><tr><th>元素</th><th>欄位名</th><th>型別</th><th>必填</th><th>驗證規則</th><th>預設值</th><th>資料來源</th><th>互動行為</th><th>F</th></tr><tr><td>篩選卡片</td><td>開發階段／縣市／鄉鎮市區／關鍵字</td><td>同 3.3（開發階段預設 5 種全選）</td><td>否</td><td>—</td><td>從清單進入：預帶清單條件；從單一案場進入：以案場名稱帶入關鍵字</td><td>—</td><td>卡片預設展開</td><td>F-05</td></tr><tr><td>按鈕組</td><td>動作</td><td>單選</td><td>否</td><td>全部／新增／編輯／刪除</td><td>全部</td><td>—</td><td>篩選紀錄的動作類型</td><td>F-05</td></tr><tr><td>日期</td><td>異動時間區間（起～迄）</td><td>日期</td><td>否</td><td>起不得晚於迄</td><td><b>近 1 年</b>（起＝今日往前一年、迄＝今日）</td><td>—</td><td>可自行調整</td><td>F-05</td></tr><tr><td>時間軸</td><td>紀錄</td><td>清單</td><td>—</td><td>—</td><td>新到舊</td><td>軌跡資料</td><td>每筆顯示動作、時間、操作者、案場名稱；編輯時顯示「欄位／修改前／修改後」</td><td>F-05</td></tr><tr><td>連結</td><td>案場名稱</td><td>連結</td><td>—</td><td>—</td><td>—</td><td>—</td><td>點擊進入該案場編輯頁（案場仍存在時）</td><td>F-05</td></tr></table></div>\n<p><b>業務規則</b></p>\n<ul><li>BR-32：新增、儲存編輯、刪除時產生軌跡；編輯紀錄<b>欄位修改前後值</b>。</li><li>BR-33：<b>所有軌跡全部保留</b>，不自動刪除。</li><li>BR-34：已刪除案場的軌跡保留，<b>不保留當時的縣市／開發階段快照</b>（客戶已確認）：這類軌跡可用關鍵字（案場名稱）、時間、動作查到；選了縣市、鄉鎮市區，或取消任一開發階段的選取時，不會列出。</li><li>BR-34a：「刪除」紀錄顯示動作標籤「刪除」、時間、操作者、案場名稱與「案場已刪除」（見截圖，動作選「刪除」）。</li><li>BR-35：進入方式：清單單筆 ⏱、編輯畫面內嵌「此案場編輯軌跡」、篩選卡片底部「編輯軌跡」。</li></ul>\n<p><b>例外流程</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>篩選後沒有紀錄</td><td>顯示空狀態</td><td>「沒有符合條件的紀錄」</td></tr></table></div>\n<h4 id=\"sp-3-10-匯出-F-06-\">3.10 匯出（F-06）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_匯出.png\" alt=\"匯出\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_匯出Excel_欄位1.png\" alt=\"匯出 Excel 欄位（左）\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_匯出Excel_欄位2.png\" alt=\"匯出 Excel 欄位（右）\"></figure>\n<p><b>業務規則</b></p>\n<ul><li>BR-36：點「匯出」直接產出 Excel，檔名「競合分析管理_yyyymmdd.xlsx」；範圍為清單目前篩選條件的結果；<b>匯出動作不需紀錄</b>。</li><li>BR-37：匯出欄位與格式如範本檔 <code>03_規格文件/競合分析管理_YYMMDD.xlsx</code>（18 欄，依序）：案場名稱、案場編號、縣市、鄉鎮市區、坐標、光電類型、專區/分區/編訂、土地權屬、集團、公司名稱、開始日期、裝置容量(MW)、目標裝置容量(MW)、面積(公頃)、開發階段、開發年月、備註、最後異動日期。</li><li>BR-38：<b>坐標只匯出 WGS84</b>，單欄「緯度, 經度」。</li><li>BR-39：<b>開發階段在 Excel 加 [1]～[5] 標示</b>（[1]開發中、[2]籌設中、[3]容許/變更中、[4]施工中、[5]已併網）；系統畫面不加。</li><li>BR-40：<b>開發年月</b>以「最後階段」（＝目前開發階段）的年月顯示；若前面階段有年月、但目前階段沒有，則開發年月留白。</li><li>BR-41：日期欄（開始日期、開發年月、最後異動日期）顯示 yyyy/mm；案場編號為文字格式（保留前導 0）；列高依文字長度自動換行。</li></ul>\n<p><b>例外流程與錯誤訊息</b></p>\n<div class=\"spscroll\"><table><tr><th>情境</th><th>系統行為</th><th>訊息文字（實際文案）</th></tr><tr><td>匯出成功</td><td>下載檔案、顯示提示</td><td>「已匯出「競合分析管理_yyyymmdd.xlsx」（共 {N} 筆，依目前篩選條件）」</td></tr></table></div>\n<h4 id=\"sp-3-11-管理中的圖層套疊-F-07-\">3.11 管理中的圖層套疊（F-07）</h4>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_管理_圖層套疊_點位與面圖層.png\" alt=\"管理中圖層\"></figure>\n<figure class=\"spimg\"><img src=\"../03_規格文件/畫面截圖/v4_編輯中切換至圖層套疊_有橘點.png\" alt=\"編輯中切換頁籤的橘點\"></figure>\n<p><b>業務規則</b></p>\n<ul><li>BR-42：競合分析管理使用中，「光電能源案場」兩個圖層<b>不鎖定</b>，可自由勾選切換；進入管理不自動取消勾選，離開管理也不還原。</li><li>BR-43：管理中：點圖層勾選＝地圖顯示管理清單點位（受清單篩選影響），取消＝隱藏點位；面圖層勾選＝顯示施工/已併網多邊形。</li><li>BR-44：進入管理時若點圖層未勾，自動勾上。</li><li>BR-45：管理中仍可從圖層套疊疊其他分類，供編輯時對照。</li><li>BR-46：進入管理後離開（✕）顯示「已離開競合分析管理」。</li><li>BR-47：<b>編輯狀態下切換到其他頁籤</b>（如圖層套疊）時，左側「競合分析管理」按鈕右上角顯示<b>橘色圓點</b>，提示仍有編輯中的案場（鎖定保留）；回到管理後圓點消失。</li></ul>\n<hr>\n<h3 id=\"sp-四-權限與資料範圍\">四、權限與資料範圍</h3>\n<div class=\"spscroll\"><table><tr><th>角色</th><th>可用操作</th><th>資料範圍</th></tr><tr><td>登入且可進入管理的使用者（韋能同仁）</td><td>檢視圖層、新增／編輯／刪除案場、查看編輯軌跡、匯出</td><td>全部案場；面圖層（施工/已併網）為唯讀固定資料</td></tr><tr><td>未登入或無管理權限者</td><td>無法進入競合分析管理</td><td>僅依既有圖層套疊權限看到圖層（<b>【需 PG 確認】</b>：無權限者是否看得到「光電能源案場」分類）</td></tr></table></div>\n<blockquote>審核確認功能已取消；不區分角色（所有可進入管理者皆可新增、編輯、刪除）。</blockquote>\n<h3 id=\"sp-五-非功能需求\">五、非功能需求</h3>\n<ul><li>資料量級：約 520 筆案場（舊資料），共編者多人；熱區與點位需順暢縮放（正式版 Mapbox GL）。</li><li>鎖定：單一案場鎖定、閒置 30 分鐘解除（即時同步方式待技術確認）。</li><li>編輯軌跡：全部保留，不設保存期限。</li><li>匯出：範圍為篩選結果；大量資料匯出行為（逾時、筆數上限）<b>【需 PG 確認】</b>。</li><li>雛型為離線示意（簡化底圖、假資料），不代表正式效能。</li></ul>\n<h3 id=\"sp-六-驗收條件-AC-PG-自測與-PM-驗收共用\">六、驗收條件（AC）— PG 自測與 PM 驗收共用</h3>\n<blockquote>PG 交付前逐項自測勾「PG自測」，全勾才交 PM；PM 驗收勾「PM驗收」。<br>不通過的在備註寫清楚現象：是 bug → PG 修復後複測；是需求認知差異或客戶改需求 → 回 /req-intake 從雛型改起。</blockquote>\n<div class=\"spscroll\"><table><tr><th>AC</th><th>類別</th><th>對應 F</th><th>Given（前置）</th><th>When（操作）</th><th>Then（預期結果）</th><th>PG自測</th><th>PM驗收</th><th>備註</th></tr><tr><td>AC-01</td><td>主流程</td><td>F-01</td><td>已登入，開啟圖層套疊</td><td>檢視分類清單</td><td>「光電能源案場」為最後一項，圖示為 article，底下有「施工/已併網案件」「開發/許可中案件」兩個圖層，圖層列沒有多邊形／點圖示</td><td>☐</td><td>☐</td><td></td></t
