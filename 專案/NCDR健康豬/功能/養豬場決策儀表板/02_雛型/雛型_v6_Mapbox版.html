  FARMS.filter(inScope).forEach(f=>{
    if(kind==='epi')f.epi.forEach(e=>out.push({f,e,ago:ago(e.nd),v:1}));
    if(kind==='rend')f.rend.forEach(r=>out.push({f,e:r,ago:ago(r.wd),v:r.n}));
    if(kind==='slh')f.slh.forEach(s=>out.push({f,e:s,ago:ago(s.d),v:s.n}));
  });
  return out;
}
const inWin=a=>a>=0&&a<state.range;
/* 疫情關注：疫情發生縣市、疫情場（發病日起）送往的屠宰場縣市 */
function attnMap(){
  const epc={},esl={},ids=new Set();
  FARMS.filter(inScope).forEach(f=>{
    const e=f.epi.filter(x=>inWin(ago(x.nd)));if(!e.length)return;
    ids.add(f.id);epc[f.county]=(epc[f.county]||0)+e.length;
    const od=e.map(x=>x.od).sort()[0];
    f.slh.filter(s=>s.d>=od&&ago(s.d)>=0).forEach(s=>esl[s.cty]=(esl[s.cty]||0)+s.n);
  });
  return {epc,esl,ids};
}

const stepOf=()=>1;

function buckets(kind){

function viewReserved(id){
  const r=RSV[id];
  return `<div class="th"><div class="bc"><button type="button" class="lnk" data-view="overview">‹ 總覽</button><h2>${r.n}<em class="rs">預留</em></h2></div>
  <div class="g2">${card('預計呈現',`<ul class="ideas">${r.ideas.map(i=>`<li>${i}</li>`).join('')}</ul><p class="s">資料來源：${r.src}。目前尚未介接，以下為版面示意。</p><p class="nt">${r.note}</p>`)}
  ${card('版面示意',r.mock==='line'?priceMock(false):`<div class="mock"><svg viewBox="0 0 300 150" width="100%" height="150" preserveAspectRatio="none">${[40,55,38,70,90,62,48,66,80,58,44,52].map((v,i)=>`<rect x="${i*25+4}" y="${140-v}" width="18" height="${v}" rx="2" fill="#c3d0bc"/>`).join('')}</svg><span class="wm">示意，非真實資料</span></div>`)}</div></div>`;
}

/* ===== 交叉對照 ===== */
function viewCompare(){
  const rows=cmpRows();
  if(!state.cmp&&rows.length)state.cmp=rows[0].f.id;
  const cur=rows.find(r=>r.f.id===state.cmp)||rows[0];
  const list=rows.map(r=>`<li class="${r.f.id===state.cmp?'on':''}" data-cmp="${r.f.id}"><b>${r.f.name}</b><span>${r.f.county}${r.f.town}</span>${r.flags.length?`<i class="fl ${r.flags[0][0]}">${r.flags.length} 項提示</i>`:'<i class="fl g">未見異常</i>'}</li>`).join('');
  let detail='<p class="empty">此範圍沒有疫情場</p>';
  if(cur){
    const f=cur.f,e=cur.e;
    detail=card(`${f.name}　時間軸`,timeline(f,e))+card('數字對照',`<table class="tb"><tbody>
      <tr><td>通報日／發病日</td><td class="r">${e.nd}／${e.od}</td></tr>
      <tr><td>送檢數量（疫情通報）</td><td class="r">${fmt(e.n)} 頭</td></tr>
      <tr><td>發病日起化製送交</td><td class="r">${fmt(cur.rh)} 頭</td></tr>
      <tr><td>化製頭數／在養頭數</td><td class="r">${f.head?(cur.rh/f.head*100).toFixed(1)+'%':'—'}</td></tr>
      <tr><td>發病日起屠宰送交</td><td class="r">${cur.sc} 批、${fmt(cur.sn)} 頭</td></tr></tbody></table>
      <div class="fls">${cur.flags.map(x=>`<i class="fl ${x[0]}">${x[1]}</i>`).join('')||'<i class="fl g">未見異常</i>'}</div>
      <p class="nt">提醒：疫情通報的數量是送檢數量，不是發病頭數；化製頭數包含所有死亡原因。這裡的比值只供相互參考，不是對帳。</p>
      <button type="button" class="lnk" data-farm="${f.id}">開啟牧場詳情 ›</button>`);
  }
  return `<div class="th"><div class="bc"><button type="button" class="lnk" data-view="overview">‹ 總覽</button><h2>交叉對照</h2></div>
   <div class="cp"><section class="c"><h3>疫情場</h3><ul class="cl sel">${list||'<li class="empty">沒有疫情場</li>'}</ul></section><div class="cpd">${detail}</div></div></div>`;
}
function timeline(f,e){
  const w=700,h=150,od=dt(e.od),a0=new Date(od-12*864e5),span=50;
  const x=d=>((dt(d)-a0)/864e5)/span*(w-30)+15;
  const lane=(y,label,col)=>`<text x="15" y="${y-8}" font-size="11" fill="#5b6b60">${label}</text><line x1="15" x2="${w-15}" y1="${y}" y2="${y}" stroke="#dce6d5"/>`;
  const rh=f.rend.filter(r=>ago(r.wd)>=0),sh=f.slh;
  const mx=Math.max(1,...rh.map(r=>r.n),...sh.map(s=>s.n));
  const bar=(d,v,y,col,t)=>`<rect x="${x(d)-4}" y="${y-Math.max(3,22*v/mx)}" width="8" height="${Math.max(3,22*v/mx)}" rx="2" fill="${col}"><title>${t}</title></rect>`;
  const ticks=[0,10,20,30,40].map(k=>{const d=new Date(a0.getTime()+k*864e5);const s=`${d.getFullYear()-1911}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;return `<text x="${x(s)}" y="${h-2}" font-size="10" text-anchor="middle" fill="#7a8a80">${d.getMonth()+1}/${d.getDate()}</text>`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">
   ${lane(40,'疫情通報',SER.epi.c)}${lane(85,'化製送交',SER.rend.c)}${lane(130,'屠宰送交',SER.slh.c)}
   <line x1="${x(e.od)}" x2="${x(e.od)}" y1="14" y2="132" stroke="#D9485A" stroke-dasharray="3 3"/><text x="${x(e.od)+4}" y="12" font-size="10" fill="#D9485A">發病日 ${e.od.slice(4)}</text>
   <rect x="${x(e.nd)-5}" y="35" width="10" height="10" fill="${SER.epi.c}"><title>通報日 ${e.nd}</title></rect>
   ${rh.map(r=>bar(r.wd,r.n,85,SER.rend.c,`${r.wd} 化製 ${r.n} 頭`)).join('')}${sh.map(s=>bar(s.d,s.n,130,SER.slh.c,`${s.t} 屠宰 ${s.n} 頭`)).join('')}${ticks}</svg>`;
}

/* ===== 牧場抽屜 ===== */
function openFarm(id){
  const f=FARMS.find(x=>x.id===id);if(!f)return;
  state.farm=id;
  const t=(arr,fn)=>arr.length?`<ul class="mini">${arr.slice(0,3).map(fn).join('')}</ul>`:'<p class="empty">無紀錄</p>';
  $('#drawer').hidden=false;$('#scrim').hidden=false;
  $('#drawer').innerHTML=`<header><div><b>${f.name}</b><small>${f.id}　${f.county}${f.town}</small></div><button type="button" data-act="closeDrawer" aria-label="關閉">×</button></header>
   <dl><dt>地址</dt><dd>${f.addr}</dd><dt>牧場種類</dt><dd>豬場</dd><dt>在養頭數</dt><dd>${fmt(f.head)} 頭</dd><dt>登記飼養畜禽種類及數量</dt><dd>${f.noReg?'—（未納入登記）':regText(f.regHead)}</dd></dl>
   <h4 style="color:${SER.epi.c}">疫情通報</h4>${t(f.epi,e=>`<li>${e.nd}　送檢 ${fmt(e.n)}　${e.res==='確診'?e.ds:'送檢中'}</li>`)}
   <h4 style="color:${SER.rend.c}">化製送交</h4>${t(f.rend,r=>`<li>${r.wd}　${fmt(r.n)} 頭</li>`)}
   <h4 style="color:${SER.slh.c}">屠宰送交</h4>${t(f.slh,s=>`<li>${s.t}　${s.house}　${s.n} 頭</li>`)}
   <a class="lnk" href="雛型_v3_儀表板.html?frame=0&farm=${f.id}" target="_blank">開啟完整牧場詳情（v3）›</a>`;
}
const regText=n=>{const b=Math.max(1,Math.round(n*.03)),s=Math.round(n*.15);return `種公豬(${b}),種母豬(${s}),肉豬(${n-b-s})`};

/* ===== 主流程 ===== */
function goFarm(id){state.fromFarm=false;state.back={view:state.view};state.view='farms';state.farm=id;state.q='';state.chk={epi:false,rend:false,slh:false};state.hl=null;render();window.scrollTo(0,0)}
const PNAME={epi:'疫情通報',rend:'化製送交',slh:'屠宰送交',farms:'牧場資訊',disease:'疾病監測',drug:'用藥監測',price:'豬價行情'};
const HOME_IC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>';
function drawCrumb(){
  const v=state.view;let h;
  if(v==='overview')h=`<span class="cr cur">${HOME_IC}養豬場資訊整合</span>`;
  else{
    h=`<button type="button" class="cr" data-view="overview" title="回到首頁">${HOME_IC}養豬場資訊整合</button>`;
    if(v==='farms'){const bk=state.back&&state.back.view;if(bk&&bk!=='overview'&&bk!=='farms')h+=`<i>/</i><button type="button" class="cr" data-view="${bk}">${PNAME[bk]}</button>`;h+='<i>/</i><span class="cr cur">牧場資訊</span>'}
    else{if(state.fromFarm&&['epi','rend','slh'].includes(v))h+='<i>/</i><button type="button" class="cr" data-view="farms">牧場資訊</button>';h+=`<i>/</i><span class="cr cur">${PNAME[v]||v}</span>`}
  }
  $('#crumb').innerHTML=h;
}
function render(){
  PENDING.length=0;
  drawBanner();drawCrumb();
  const v=state.view,m=$('#main');
  const themed=['epi','rend','slh'].includes(v);
  if(v==='overview')m.innerHTML=viewOverview();
  else{
    const inner=v==='farms'?viewFarms():themed?viewTheme(v):v==='compare'?viewCompare():viewReserved(v);
    m.innerHTML=`<div class="ov pg">${mapCard(themed?v:state.metric,!themed)}<div class="rcol">${inner}</div></div>`;
  }
  PENDING.splice(0).forEach(fn=>fn());
  const ch=$('#fChip');ch.hidden=!state.county;ch.innerHTML=state.county?`${state.county}<button type="button" data-act="clearCounty" aria-label="清除">×</button>`:'';
  $('#fCounty').value=state.county;$('#fRange').value=String(state.range);
}
document.addEventListener('click',e=>{
  const g=(s)=>e.target.closest(s);
  let x;
  if(x=g('tr[data-d]')){setHL(x.dataset.d);return}
  if(x=g('[data-farm]')){if(state.view==='farms'){state.farm=x.dataset.farm;state.hl=null;render()}else goFarm(x.dataset.farm);return}
  if(x=g('[data-fm]')){state.fm=x.dataset.fm;render();return}
  if(x=g('[data-fmap]')){state.fmap=x.dataset.fmap;render();return}
  if(x=g('[data-county]')){const c=x.dataset.county;state.county=state.county===c?'':c;render();return}
  if(x=g('[data-cmpfarm]')){state.cmp=x.dataset.cmpfarm;state.view='compare';render();window.scrollTo(0,0);return}
  if(x=g('[data-cmp]')){state.cmp=x.dataset.cmp;if(state.view!=='compare')state.view='compare';render();return}
  if(x=g('[data-view]')){e.preventDefault();if(x.dataset.view==='farms'){state.back=null;state.attn=!!x.dataset.attn;if(!x.dataset.attn)state.atype={slh:false,wait:false}}
    if(x.dataset.fdet){state.fdet=x.dataset.fdet;state.fromFarm=true}else if(['epi','rend','slh'].includes(x.dataset.view)){state.fdet='';state.fromFarm=false}else if(x.dataset.view==='overview'){state.fdet='';state.fromFarm=false;state.attn=false;state.atype={slh:false,wait:false}}state.view=x.dataset.view;render();window.scrollTo(0,0);return}
  if(x=g('[data-metric]')){state.metric=x.dataset.metric;render();return}
  if(x=g('[data-act]')){const a=x.dataset.act;
    if(a==='closeDrawer'){$('#drawer').hidden=true;$('#scrim').hidden=true}
    if(a==='clearCounty'){state.county='';render()}
    if(a==='clearAttn'){state.attn=false;render()}
    if(a==='clearSel'){delete state.sels[x.dataset.cid];render()}
    if(a==='closeBanner'){state.bannerClosed=true;drawBanner()}
    if(a==='toggleSide'){setSide(!document.body.classList.contains('side-min'))}
    return}
  if(g('#scrim')){$('#drawer').hidden=true;$('#scrim').hidden=true}
});
document.addEventListener('input',e=>{if(e.target.id==='sInput'){state.q=e.target.value.trim();$('#sres').innerHTML=farmList()}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.atype){state.atype[e.target.dataset.atype]=e.target.checked;render();return}
  if(e.target.dataset&&e.target.dataset.chk){state.chk[e.target.dataset.chk]=e.target.checked;render()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold)state.fold[d.dataset.fold]=d.open},true);
document.addEventListener('change',e=>{if(e.target.id==='fDet'){state.fdet=e.target.value;render()}});
$('#fRange').onchange=e=>{state.sels={};state.range=+e.target.value;render()};
$('#fCounty').onchange=e=>{state.county=e.target.value;render()};
$('#fCounty').innerHTML='<option value="">縣市不拘</option>'+COUNTIES.map(c=>`<option>${c}</option>`).join('');
function setSide(min){document.body.classList.toggle('side-min',min);try{localStorage.setItem('v4side',min?'1':'0')}catch(e){}}
const sp=new URLSearchParams(location.search);
try{if(sp.get('nav')==='0'||(sp.get('nav')===null&&localStorage.getItem('v4side')==='1'))document.body.classList.add('side-min')}catch(e){if(sp.get('nav')==='0')document.body.classList.add('side-min')}
if(sp.get('view'))state.view=sp.get('view');
if(sp.get('open')){sp.get('open').split(',').forEach(k=>{state.fold[k]=true})}
if(sp.get('attn')==='1')state.attn=true;
if(sp.get('atype')){sp.get('atype').split(',').forEach(k=>{if(k in state.atype)state.atype[k]=true})}
if(sp.get('range'))state.range=+sp.get('range')===7?7:30;
if(sp.get('sel')){const m=sp.get('sel').split(':');const q=(m[1]||'').split(',').map(Number);if(m[0]&&q.length===2)state.sels[m[0]]={from:Math.max(q[0],q[1]),to:Math.min(q[0],q[1])}}
if(sp.get('county'))state.county=sp.get('county');
if(sp.get('metric'))state.metric=sp.get('metric');
if(sp.get('fm'))state.fm=sp.get('fm');
if(sp.get('fmap'))state.fmap=sp.get('fmap')==='all'?'all':'one';
render();
if(sp.get('to')==='detail'){setTimeout(()=>{const w=document.querySelector('.c.wide');if(w)w.scrollIntoView()},400)}
if(sp.get('farm')){if(state.view==='farms'){state.farm=sp.get('farm');render()}else openFarm(sp.get('farm'))}
</script>
</body>
</html>
