 doClose();
}
function doClose(){S.manage=false;S.sel=null;S.view='layers';const p=S.prev||{};S.gov=!!p.gov;S.vena=!!p.vena;render();toast(p.gov||p.vena?'已離開競合分析管理，並還原進入前的競合分析圖層勾選':'已離開競合分析管理');}
function curName(){return S.editId==='new'?'新案場':(cases.find(c=>c.id===S.editId)||{}).name||'';}

/* ===== 面板 ===== */
function render(){renderUser();renderRail();renderPanel();renderMap();renderNotes();}
function renderPanel(){
 const p=document.getElementById('panel');
 if(S.view==='layers')p.innerHTML=viewLayers();
 else if(S.view==='spatial'||S.view==='locate')p.innerHTML=viewStub();
 else if(S.view==='list')p.innerHTML=viewList();
 else if(S.view==='medit')p.innerHTML=viewEdit();
 else if(S.view==='mtrace')p.innerHTML=viewTrace();
 if(S.view==='medit')wireEdit();
}
function viewStub(){const n=S.view==='spatial'?'空間分析':'定位工具';return `<div class="panel-head"><h2>${n}</h2><button class="x" onclick="S.view=S.manage?(S.editId?'medit':'list'):'layers';render()">✕</button></div><div class="panel-body"><div class="empty"><b>（沿用現有畫面，本次不變動）</b>${S.manage?'目前仍在競合分析管理中，按 ✕ 回到管理面板。':''}</div></div>`;}

function grp(ic,t,open=false,body=''){return `<div class="group ${open?'open':''}"><div class="gh" onclick="this.parentNode.classList.toggle('open')"><span class="gi">${ic}</span><span>${t}</span><span class="sp"></span><span>⌄</span></div><div class="gb">${body}</div></div>`;}
function viewLayers(){
 const dis=S.manage;
 /* SPEC: F-01 圖層套疊新增分類「競合分析」；F-07 管理模式中本分類停用 */
 const comp=`<div class="group open ${dis?'disabled':''}"><div class="gh" onclick="this.parentNode.classList.toggle('open')"><span class="gi">⚔</span><span>競合分析</span><span class="tag edit" style="margin-left:6px">新增</span><span class="sp"></span><span>⌃</span></div><div class="gb">
 ${dis?'<div class="callout info">ℹ️ 競合分析管理使用中，此分類由管理功能提供地圖顯示，暫時無法勾選。其他分類的圖層仍可自由疊加。</div>':''}
 <div class="layer-row"><input type="checkbox" ${S.gov?'checked':''} ${dis?'disabled':''} onchange="S.gov=this.checked;renderMap()"><div class="nm">能源署核准案場 <span class="tag fix">面・固定資料</span></div></div>

 </div>`;
}

 const chips=['全部','開發中','籌設','施工'].map(x=>`<button class="chip ${S.filter===x?'on':''}" onclick="S.filter='${x}';render()">${x}</button>`).join('');
 const sum=[S.q?`「${esc(S.q)}」`:'',S.filter!=='全部'?S.filter:''].filter(Boolean).join('・')||'無篩選條件';
 return `<div class="panel-head"><h2>競合分析管理</h2><button class="x" onclick="closeManage()">✕</button></div>
 <div class="panel-body">
  <div class="toolbar"><button class="btn primary sm" onclick="startEdit('new')">＋ 新增案場</button><button class="btn sm" onclick="askExport()">⬇ 匯出</button><button class="btn sm" onclick="openTrace('all','list')">⏱ 編輯軌跡</button></div>
  <div class="fbar" onclick="S.fopen=!S.fopen;render()"><span>🔍 篩選</span><span class="fsum">${sum}</span><span class="grow"></span><span class="stat">共 ${L.length} 筆</span><span>${S.fopen?'⌃':'⌄'}</span></div>
  ${S.fopen?`<div class="fbody"><div class="search">🔍<input placeholder="搜尋案場名稱、縣市、鄉鎮市區" value="${esc(S.q)}" oninput="S.q=this.value;renderPanelKeep(this)"></div>
   <div class="chips"><span class="stat">狀態</span>${chips}</div></div>`:''}
  ${rows||`<div class="empty"><b>目前沒有案場資料</b>${S.empty?'按「新增案場」建立第一筆，或日後由匯入功能帶入（待定）。':'沒有符合條件的案場。'}</div>`}
 </div>`;

function renderPanelKeep(el){const pos=el.selectionStart;renderPanel();renderMap();const n=document.querySelector('.fbody .search input');if(n){n.focus();n.setSelectionRange(pos,pos);}}
function selCase(id){S.sel=id;render();const c=cases.find(x=>x.id===id);if(c)flyTo(c.gl,c.gn,Math.max(M.z,12.2));}

/* ===== 編輯（F-03、F-04） ===== */
function startEdit(id){
 if(id!=='new'){
  const c=cases.find(x=>x.id===id);
  if(c.lock&&c.lock.by!==ME){toast(`🔒 ${c.lock.by} 於 ${c.lock.since} 起正在編輯「${c.name}」，請待對方儲存或取消後再編輯`);return;}
  if(S.editId&&S.editId!==id){toast('您正在編輯另一筆案場，請先儲存或取消');return;}
  c.lock={by:ME,since:'現在'};
  S.orig=JSON.parse(JSON.stringify(c));S.draft=JSON.parse(JSON.stringify(c));S.draft.posMode='coord';S.secClosed={};S.sel=id;flyTo(c.gl,c.gn,Math.max(M.z,12.2));
 }else{
  if(S.editId){toast('您正在編輯另一筆案場，請先儲存或取消');return;}
  S.orig=null;S.draft={csys:'WGS84 經緯度',name:'',pic:'',county:'',town:'',lat:'',lng:'',type:'',landuse:'',owner:'',major:'',partner:'',start:'',cap:'',tcap:'',area:'',stage:'開發中',remarks:'',posMode:'map'};PH.forEach(p=>{S.draft['ph_'+p.k]='';S.draft['ym_'+p.k]='';});
 }
 S.editId=id;S.view='medit';S.traceOpen=false;S.pick=false;syncDraftPos();render();
}
function toggleSec(s){S.secClosed[s]=S.secClosed[s]===false?true:(S.secClosed[s]===true?false:true);rerenderEdit();}
function phaseHtml(d){return `<div class="fld"><label>開發進度項目（勾選＝已達成，會自動判斷上方「狀態」）</label>`+PH.map(p=>{const on=d['ph_'+p.k]==='1';return `<div class="ph ${on?'on':''}"><label class="phl"><input type="checkbox" data-k="ph_${p.k}" ${on?'checked':''}> ${p.l}</label><input type="month" data-k="ym_${p.k}" value="${esc(d['ym_'+p.k]||'')}" ${on?'':'disabled'} title="達成年月（選填）"><span class="to">→ ${p.map}</span></div>`;}).join('')+`<div class="hint">年月只記錄到年月、選填（資訊不易取得），不作為狀態判斷依據；勾選項目與狀態的對應為暫定，待韋能提供（Q-16）。</div></div>`;}
function fieldHtml(F,d){
 const tw=isTW(d),v=d[F.k]??'';let inp;
 const lbl=F.k==='lat'?(tw?'Y（N，公尺）':F.l):F.k==='lng'?(tw?'X（E，公尺）':F.l):F.l;
 const hnt=F.k==='lat'?(tw?'TWD97 TM2，如 2613047.1':F.hint):F.k==='lng'?(tw?'TWD97 TM2，如 201459.0':F.hint):(F.hint||(F.max?`最多 ${F.max} 字`:''));
 if(F.t==='auto'){
  if(F.k==='pic')inp=`<input readonly value="${esc(v)}" placeholder="儲存後由系統自動編號">`;
  else{const ch=S.orig&&S.orig.stage!==v;inp=`<div class="autov ${ch?'changed':''}"><span class="stage ${v}">${v}</span> <span class="hint">依下方已達成的開發進度項目自動判斷，不能手動修改</span></div>`;}
 }else if(F.t==='select'){
  const opts=F.k==='town'?(TOWNS[d.county]||[]):F.o;
  inp=`<select data-k="${F.k}">${F.req||F.k==='town'?'':''}<option value="">${F.k==='town'&&!d.county?'請先選縣市':'請選擇'}</option>${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  if(F.k==='csys')inp=`<select data-k="${F.k}">${F.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 }else if(F.t==='area')inp=`<textarea data-k="${F.k}" maxlength="${F.max}">${esc(v)}</textarea>`;
 else if(F.t==='num')inp=`<input type="number" step="any" min="0" data-k="${F.k}" value="${esc(v)}">`;
 else if(F.t==='month')inp=`<input type="month" data-k="${F.k}" value="${esc(v)}">`;
 else inp=`<input data-k="${F.k}" value="${esc(v)}" ${F.max?`maxlength="${F.max}"`:''} ${F.t==='coord'&&d.posMode==='map'?'readonly':''}>`;
 return (F.k==='csys'?'<div class="subh">座標 <span class="req">*</span><span class="hint">　可於地圖上點選或輸入座標，支援 WGS84、TWD97</span></div>':'')+`<div class="fld"><label>${lbl}${F.req?' <span class="req">*</span>':''}</label>${inp}${hnt?`<div class="hint">${hnt}</div>`:''}</div>`;
}
function viewEdit(){
 const isNew=S.editId==='new',d=S.draft;
 /* SPEC: F-03 編輯欄位依分類呈現，分類可收合（土地基礎資訊／投資市場／裝置容量／開發進度／其他） */
 const secs=[...new Set(FIELDS.map(F=>F.sec))];
 const f=secs.map(sec=>{const open=S.secClosed[sec]!==true;
  let inner=FIELDS.filter(F=>F.sec===sec).map(F=>fieldHtml(F,d)+(F.k==='csys'?posBlock(d):'')).join('');
  if(sec==='開發進度')inner+=phaseHtml(d);
  return `<div class="sec ${open?'open':''}"><div class="fsec acc" onclick="toggleSec('${sec}')"><span>${sec}</span><span class="chev">${open?'⌃':'⌄'}</span></div><div class="secbody">${inner}</div></div>`;}).join('');
 const ev=isNew?[]:traces.filter(t=>t.cid===S.editId).slice(0,3);
 /* SPEC: F-04 共編鎖定提示；F-05 編輯畫面內嵌「此案場編輯軌跡」 */
 return `<div class="panel-head"><h2>${isNew?'新增案場':'編輯案場'}</h2><button class="x" onclick="closeManage()">✕</button></div>
 <div class="panel-body"><button class="back" onclick="backList()">‹ 返回案場清單（${isNew?'放棄新增':'取消編輯'}）</button>
  ${isNew?'':'<div class="callout lock">🔒 您正在編輯此案場，其他人暫時無法編輯它（其他案場不受影響）。儲存、取消，或閒置超過一段時間（時間長度待定）後自動解除。</div>'}
  <div class="callout info">黃底欄位 = 本次已修改，儲存後會寫入編輯軌跡。<a href="#" onclick="S.secClosed=S.allClosed?{}:Object.fromEntries(secs0().map(s=>[s,true]));S.allClosed=!S.allClosed;rerenderEdit();return false" style="margin-left:8px;color:var(--teal-d);font-weight:700">全部收合／展開</a></div>
  ${f}
  ${isNew?'':`<div class="inline-trace ${S.traceOpen?'open':''}"><div class="th" onclick="S.traceOpen=!S.traceOpen;this.parentNode.classList.toggle('open')">⏱ 此案場編輯軌跡（${traces.filter(t=>t.cid===S.editId).length}）<span class="sp"></span>⌄</div><div class="tb">${ev.map(evHtml).join('')||'<div class="stat">尚無紀錄</div>'}<button class="btn sm" onclick="openTrace(${S.editId},'medit')">在軌跡頁檢視全部</button></div></div>`}
 </div>
 <div class="panel-foot"><button class="btn" onclick="backList()">取消</button><button class="btn primary" onclick="saveEdit()">儲存</button></div>`;
}
function secs0(){return [...new Set(FIELDS.map(F=>F.sec))];}
function wireEdit(){
 document.querySelectorAll('#panel [data-k]').forEach(el=>{
  const k=el.dataset.k;
  const h=()=>{const oldCs=S.draft.csys;S.draft[k]=el.type==='checkbox'?(el.checked?'1':''):el.value;
   if(k==='csys'){convertCs(oldCs,el.value);rerenderEdit();syncDraftPos();drawMap();return;}
   if(k==='county'){S.draft.town='';rerenderEdit();return;}
   if(k.startsWith('ph_')){S.draft.stage=calcStage(S.draft);rerenderEdit();return;}
   if(k==='lat'||k==='lng'){syncDraftPos();drawMap();}
   const o=S.orig?S.orig[k]:'';el.classList.toggle('changed',el.value!==(o??'')&&(S.orig||el.value!==''));};
  el.addEventListener('input',h);el.addEventListener('change',h);
  if(el.type!=='checkbox'){const o0=S.orig?S.orig[k]:'';el.classList.toggle('changed',el.value!==(o0??'')&&(S.orig||el.tagName!=='SELECT'&&el.value!==''));}
 });
}
/* ===== 位置設定：輸入座標 或 地圖點選（F-03） ===== */
function toTWD97(lat,lng){const a=6378137,e2=0.00669438002290,k0=0.9999,lon0=121*Math.PI/180,phi=lat*Math.PI/180,lam=lng*Math.PI/180;
 const ep2=e2/(1-e2),N=a/Math.sqrt(1-e2*Math.sin(phi)**2),T=Math.tan(phi)**2,C=ep2*Math.cos(phi)**2,A=(lam-lon0)*Math.cos(phi),e4=e2*e2,e6=e4*e2;
 const Mr=a*((1-e2/4-3*e4/64-5*e6/256)*phi-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*phi)+(15*e4/256+45*e6/1024)*Math.sin(4*phi)-(35*e6/3072)*Math.sin(6*phi));
 return [k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+250000,k0*(Mr+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];}
function fromTWD97(x,y){let la=y/110950,ln=121+(x-250000)/102000;for(let i=0;i<8;i++){const p=toTWD97(la,ln);la+=(y-p[1])/110950;ln+=(x-p[0])/(111320*Math.cos(la*Math.PI/180));}return [la,ln];}
const isTW=d=>(d.csys||'').startsWith('TWD97');
function parsePos(d){const a=parseFloat(d.lat),b=parseFloat(d.lng);if(isNaN(a)||isNaN(b))return null;return isTW(d)?fromTWD97(b,a):[a,b];}
function fmtPos(la,ln,tw){if(tw){const p=toTWD97(la,ln);return {lat:p[1].toFixed(1),lng:p[0].toFixed(1)};}return {lat:la.toFixed(5),lng:ln.toFixed(5)};}
function syncDraftPos(){S.draftPos=S.draft?parsePos(S.draft):null;}
function convertCs(oldCs,newCs){if(oldCs===newCs)return;const p=parsePos({lat:S.draft.lat,lng:S.draft.lng,csys:oldCs});if(p)Object.assign(S.draft,fmtPos(p[0],p[1],newCs.startsWith('TWD97')));}
function rerenderEdit(){const b=document.querySelector('#panel .panel-body'),y=b?b.scrollTop:0;renderPanel();const b2=document.querySelector('#panel .panel-body');if(b2)b2.scrollTop=y;}
function posBlock(d){const m=d.posMode||'coord';return `<div class="fld"><label>位置設定方式 <span class="req">*</span></label><div class="seg"><button class="${m==='coord'?'on':''}" onclick="setPosMode('coord')">輸入座標</button><button class="${m==='map'?'on':''}" onclick="setPosMode('map')">地圖點選</button></div>${m==='map'?`<button class="btn sm ${S.pick?'primary':''}" style="margin-top:8px" onclick="pickToggle()">${S.pick?'請在地圖上點一下…（再按取消）':'📍 在地圖上點選位置'}</button><div class="hint">點選後自動帶入下方座標，可重新點選修正；建議先放大地圖再點選。</div>`:'<div class="hint">直接輸入下方座標，地圖會同步顯示新位置（粉紅點）。</div>'}</div>`;}
function setPosMode(m){S.draft.posMode=m;if(m==='coord')S.pick=false;rerenderEdit();drawMap();}
function pickToggle(){S.pick=!S.pick;if(S.pick&&M.z<12)flyTo(M.lat,M.lng,12);rerenderEdit();drawMap();}
function setPosFromWgs(la,ln){Object.assign(S.draft,fmtPos(la,ln,isTW(S.draft)));S.pick=false;syncDraftPos();rerenderEdit();drawMap();toast('已帶入座標：'+S.draft.lat+', '+S.draft.lng+'（可再點選修正）');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pick){S.pick=false;rerenderEdit();drawMap();}});
function renderUser(){const u=document.getElementById('uc');if(u)u.innerHTML='👤 '+ME+' <a href="#">登出</a>';}
function releaseEdit(){if(S.editId&&S.editId!=='new'){const c=cases.find(x=>x.id===S.editId);if(c)c.lock=null;}S.editId=null;S.draft=null;S.orig=null;S.pick=false;S.draftPos=null;drawMap();}
function backList(){releaseEdit();S.view='list';render();}
function saveEdit(){
 const d=Object.assign({},S.draft);delete d.posMode;d.stage=calcStage(d);
 for(const F of FIELDS){if(F.req&&!String(d[F.k]||'').trim()){toast(`請填寫「${F.l}」`);return;}}
 for(const F of FIELDS){if(F.t==='num'&&d[F.k]&&isNaN(+d[F.k])){toast(`「${F.l}」需為數字`);return;}}
 if(d.lat&&isNaN(parseFloat(d.lat))||d.lng&&isNaN(parseFloat(d.lng))){toast('座標需為數字（依所選座標系統）');return;}
 if(!S.draftPos){toast('請設定案場位置：輸入座標，或在地圖上點選');return;}
 const now='2026/10/13 '+new Date().toTimeString().slice(0,5);
 if(S.editId==='new'){
  const c=Object.assign({id:nextId++,gl:S.draftPos[0],gn:S.draftPos[1],upd:ME+' '+now.slice(0,10),lock:null},d);c.pic=String(1000+c.id);cases.push(c);
  traces.unshift({id:traceSeq++,t:now,u:ME,a:'新增',cid:c.id,cn:c.name,diff:[]});S.sel=c.id;toast('已新增案場並寫入編輯軌跡');
 }else{
  const fm=(k,v)=>k.startsWith('ph_')?(v==='1'?'已達成':'未達成'):(v||'（空）');
  const diff=[];ALLK.forEach(([k,l])=>{const a=S.orig[k]||'',b=d[k]||'';if(a!==b)diff.push([l,fm(k,a),fm(k,b)]);});
  if(!diff.length){toast('沒有任何變更，已解除鎖定');backList();return;}
  const c=cases.find(x=>x.id===S.editId);Object.assign(c,d,{upd:ME+' '+now.slice(0,10),gl:S.draftPos[0],gn:S.draftPos[1]});
  traces.unshift({id:traceSeq++,t:now,u:ME,a:'編輯',cid:c.id,cn:c.name,diff});toast(`已儲存 ${diff.length} 項變更並寫入編輯軌跡`);

<tr><td>地圖操作</td><td>可拖曳平移、滾輪／＋－／雙擊縮放；點清單案場會飛到該案場並放大到點位層級。正式版採 Mapbox GL（雛型為離線示意底圖）。</td></tr>
<tr><td>熱區模式</td><td>縮放小於約 z10.6：以案場密度熱區呈現（藍→綠→黃→橘→紅，類似 OpenInfraMap 的縮小檢視）；熱區半徑隨縮放縮小。</td></tr>
<tr><td>點位模式</td><td>縮放大於約 z11.8：顯示個別點位（依狀態配色），中間為淡入淡出過渡；切換門檻與權重待定（Q-10）。</td></tr>
<tr><td>狀態</td><td>開發中／籌設／施工（PM 確認，沒有已併網）。</td></tr></table>
<h3>F-02 案場清單</h3>
<table><tr><th>欄位</th><th>型別</th><th>說明</th></tr>
<tr><td>案場名稱／縣市／鄉鎮市區／狀態</td><td>文字</td><td>清單只列這四項【PM確認 2026-10-07】，每筆兩行、操作鈕集中在同一列；其餘資訊進入下一層才看得到。篩選區（名稱查詢、狀態）可收合，預設收合，收合時顯示目前篩選條件摘要【PM確認 2026-10-07】</td></tr>
<tr><td>鎖定狀態</td><td>標籤</td><td>他人鎖定顯示「🔒 姓名 編輯中」；自己鎖定顯示「編輯中（您）」</td></tr></table>
<h3>F-03 編輯欄位（2026-10-13 客戶訪談：欄位表）</h3>
<p>編輯畫面依分類呈現，各分類可收合。必填：案場名稱、縣市、鄉鎮市區、座標。</p>
<table><tr><th>分類</th><th>欄位（原 Excel 欄位）</th><th>格式</th><th>必填</th><th>規則</th></tr>
${FIELDS.filter(F=>F.k!=='lng'&&F.k!=='csys').map(F=>`<tr><td>${F.sec}</td><td>${F.k==='lat'?'座標（Coordinate）':F.l}（${F.orig}）</td><td>${F.f}</td><td>${F.k==='lat'||F.req?'必填':F.t==='auto'?'系統自動':'選填'}</td><td>${F.k==='lat'?FIELDS.find(x=>x.k==='csys').rule:F.rule}</td></tr>`).join('')}
${PH.map(p=>`<tr><td>開發進度</td><td>${p.l}（${p.orig}）：勾選＋年月</td><td>勾選／年月</td><td>選填</td><td>勾選＝已達成；對應狀態「${p.map}」（暫定，Q-16）；年月只記到年月、選填，不作為狀態判斷依據</td></tr>`).join('')}
</table>
<p>狀態判斷（暫定）：取已達成項目中最後一項所對應的狀態；未勾選任何項目時顯示「開發中」。</p>
<h3>業務規則</h3><ul>
<li>F-04 鎖定以「單一案場」為單位；A 編輯某案場時，該案場對他人唯讀（編輯／刪除不可用），其他案場不受影響。釋放條件：儲存、取消、離開管理（放棄）、閒置逾時自動解除（【PM 傾向】閒置判定；時間長度與強制解鎖＝Q-02）。</li>
<li>F-03 位置設定：使用者可自選「輸入座標」或「地圖點選」。輸入座標時地圖同步顯示粉紅暫存點；地圖點選時點擊地圖自動帶入座標（依所選座標系統，WGS84 與 TWD97 互相換算），座標欄位唯讀，可重新點選修正；Esc 取消點選。新增案場必須有位置才能儲存。</li><li>F-05 軌跡於「新增／儲存編輯／刪除」時產生；編輯記錄欄位修改前後值【PM確認 2026-10-06】。可由清單單筆 ⏱、編輯畫面內嵌區塊、或管理工具列進入，並可切換「全部案場／特定案場」。</li>
<li>F-06 匯出含座標；範圍可選全部或目前篩選結果。</li>
<li>F-07 管理與圖層互斥：進入管理自動移除競合分析圖層，避免同時套疊兩層；離開管理時自動還原進入前的競合分析圖層勾選狀態【PM確認 2026-10-06】。</li><li>F-03 刪除後不可復原，僅在軌跡留紀錄【PM確認 2026-10-06】。座標系統可選 WGS84 經緯度或 TWD97 TM2，與定位工具一致【PM確認 2026-10-06】。</li></ul>
<h3>例外流程</h3><ul><li>點擊他人鎖定案場的編輯：提示鎖定者與起始時間，不進入編輯。</li><li>必填未填儲存：提示欄位名稱。</li><li>無變更儲存：提示並解除鎖定，不產生軌跡。</li><li>編輯中離開管理：確認是否放棄。</li><li>座標系統切換為 TWD97 時，座標欄位標籤與提示改為 X／Y。</li><li>清單為空：顯示空狀態與新增引導。</li></ul>`;
/* ===== 啟動 ===== */
const qp=new URLSearchParams(location.search);
if(qp.get('notes')==='1')document.body.classList.add('notes');
if(qp.get('spec')==='1')document.body.classList.add('spec');
if(qp.get('fopen'))S.fopen=true;
const st=qp.get('state');
if(st){ if(st==='list'||st==='pick'||st==='picked'||st==='edit'||st==='trace'||st==='export'){S.manage=true;S.gov=S.vena=false;S.view='list';}
 if(st==='edit')startEdit(2); if(st==='trace')openTrace('all','list'); if(st==='export')setTimeout(askExport,50);if(st==='pick'){startEdit('new');S.pick=true;flyTo(23.3,120.2,11.5);rerenderEdit();}if(st==='picked'){startEdit('new');S.draft.name='示範新案場';setPosFromWgs(23.3,120.2);flyTo(23.3,120.2,11.8);}}
if(qp.get('closed'))qp.get('closed').split(',').forEach(s=>S.secClosed[decodeURIComponent(s)]=true);
if(qp.get('z')){M.z=+qp.get('z');M.lat=+(qp.get('lat')||M.lat);M.lng=+(qp.get('lng')||M.lng);}
render();
</script>
