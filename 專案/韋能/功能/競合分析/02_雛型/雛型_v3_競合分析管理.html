<h3>業務規則</h3><ul>
<li>F-04 鎖定以「單一案場」為單位；A 編輯某案場時，該案場對他人唯讀（編輯／刪除不可用），其他案場不受影響。釋放條件：儲存、取消、離開管理（放棄）、閒置逾時自動解除（【PM 傾向】閒置判定；時間長度與強制解鎖＝Q-02）。</li>
<li>F-03 位置設定：使用者可自選「輸入坐標」或「地圖點選」。輸入坐標時地圖同步顯示粉紅暫存點；地圖點選時點擊地圖自動帶入坐標（依所選坐標系統，WGS84 與 TWD97 互相換算），坐標欄位唯讀，可重新點選修正；Esc 取消點選。新增案場必須有位置才能儲存。</li><li>F-05 軌跡於「新增／儲存編輯／刪除」時產生；編輯記錄欄位修改前後值【PM確認 2026-10-06】。可由清單單筆 ⏱、編輯畫面內嵌區塊、或管理工具列進入，並可切換「全部案場／特定案場」。</li>
<li>F-06 匯出：點擊「匯出」後直接產出 Excel（.xlsx），檔名「競合分析管理_yyyymmdd.xlsx」（yyyymmdd 為匯出當日），不跳出視窗、不提供 CSV；範圍為清單目前篩選條件的結果；含坐標（WGS84 經緯度）。欄位範圍待確認（Q-07）。</li>
<li>F-07 管理與圖層互斥：進入管理自動移除競合分析圖層，避免同時套疊兩層；離開管理時自動還原進入前的競合分析圖層勾選狀態【PM確認 2026-10-06】。</li><li>F-03 刪除後不可復原，僅在軌跡留紀錄【PM確認 2026-10-06】。坐標系統可選 WGS84 經緯度或 TWD97 TM2，與定位工具一致【PM確認 2026-10-06】。</li></ul>
<h3>例外流程</h3><ul><li>點擊他人鎖定案場的編輯：提示鎖定者與起始時間，不進入編輯。</li><li>必填未填儲存：提示欄位名稱。</li><li>無變更儲存：提示並解除鎖定，不產生軌跡。</li><li>編輯中離開管理：確認是否放棄。</li><li>坐標系統切換為 TWD97 時，坐標欄位標籤與提示改為 X／Y。</li><li>清單為空：顯示空狀態與新增引導。</li></ul>`;
/* ===== 啟動 ===== */
const qp=new URLSearchParams(location.search);
if(qp.get('notes')==='1')document.body.classList.add('notes');
if(qp.get('spec')==='1')document.body.classList.add('spec');
if(qp.get('fopen'))S.fopen=true;
if(qp.get('fcounty'))S.lf.county=decodeURIComponent(qp.get('fcounty'));if(qp.get('fstage'))S.lf.stage=decodeURIComponent(qp.get('fstage')).split(',');
const st=qp.get('state');
if(st){ if(st==='list'||st==='editlayers'||st==='managelayers'||st==='trace1'||st==='popup'||st==='idle'||st==='pick'||st==='picked'||st==='edit'||st==='trace'||st==='export'){S.manage=true;S.gov=S.vena=false;S.view='list';}
 if(st==='edit')startEdit(2); if(st==='trace')openTrace('all','list');if(st==='trace1')openTrace(4,'list'); if(st==='export')setTimeout(askExport,50);if(st==='pick'){startEdit('new');S.pick=true;flyTo(23.3,120.2,11.5);rerenderEdit();}if(st==='managelayers'){S.view='layers';}if(st==='editlayers'){startEdit(2);S.view='layers';}if(st==='popup'){selCase(1);}if(st==='idle'){startEdit(2);setTimeout(showIdleWarn,80);}if(st==='picked'){startEdit('new');S.draft.name='示範新案場';setPosFromWgs(23.3,120.2);flyTo(23.3,120.2,11.8);}}
if(qp.get('closed'))qp.get('closed').split(',').forEach(s=>S.secClosed[decodeURIComponent(s)]=true);
if(qp.get('tfrom'))S.tf.from=qp.get('tfrom');if(qp.get('tto'))S.tf.to=qp.get('tto');
if(qp.get('z')){M.z=+qp.get('z');M.lat=+(qp.get('lat')||M.lat);M.lng=+(qp.get('lng')||M.lng);}
render();
</script>
</body>
